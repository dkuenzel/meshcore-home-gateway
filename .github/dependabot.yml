# Weekly update proposals, only for releases that are at least 14 days old (cooldown).
# `make lock` writes the lock files of the Python tools in the form Dependabot writes them
# (SUP-004): its pull requests change versions and hashes only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # Pinned to the version of Debian 13 (python3-paho-mqtt, ADR 0005), the deployment target:
      # CI tests what production runs. Raise it together with the deployment target.
      - dependency-name: "paho-mqtt"

  # The Home Assistant test environment: only the plugin, which pins one Home Assistant release.
  # Regenerate the lock file in the pull request with `make ha-lock`, which applies
  # home-assistant/overrides.txt (SUP-005).
  - package-ecosystem: pip
    directory: /home-assistant
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    allow:
      - dependency-name: pytest-homeassistant-custom-component
