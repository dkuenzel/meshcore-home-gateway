# CI runs the same Makefile targets as a local `make check` (and the pre-push hook).
# Supply chain: actions pinned to full commit SHAs, read-only token, no persisted credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; every commit on main runs to the end, so the
# release job of each one runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor, 3.13 matches Debian 13 (the deployment target), 3.14 is current.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the MQTT broker for the integration tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mosquitto
      - name: Tests with coverage gate
        run: make test

  homeassistant:
    name: Home Assistant contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14" # the pinned Home Assistant needs 3.14.2 or newer
      - name: Discovery, payloads and the documented automations against Home Assistant
        run: make ha-test HA_PYTHON=python

  # docs/testing.md#tests-against-the-real-firmware: MeshCore's firmware at the pinned release,
  # fetched from GitHub by tag and checked against its commit, built natively; the gateway talks
  # to it through its serial transport on a pseudo terminal. The scenarios run in real time.
  firmware:
    name: real firmware on a simulated air
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the compiler and OpenSSL's headers for the native build, and the broker
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends g++ libssl-dev mosquitto
      - name: Fetch and build the firmware, then the tests against it
        run: make --jobs="$(nproc)" firmware-test

  check:
    name: lint, shellcheck, workflow audit, build, unit check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Static checks
        run: make lint shellcheck workflows
      # One invocation: unit-check takes the zipapp that dist builds.
      - name: Build wheel, sdist and zipapp, verify the systemd unit and its exposure score
        run: make dist unit-check

  release-plan:
    name: release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base, the tags and the release candidate a release must equal
      - name: The version is the next one and the public interface stays compatible
        env: # a pull request's base, or the commit before a push (its parent if unknown)
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 -I tools/release_plan.py check --base "$BASE"

  # Release (ADR 0022, docs/development.md): a push to main that changed __version__ and passed
  # every job above is tagged vX.Y.Z on its last commit, and release.yml is started on the tag;
  # it builds, attests and publishes. A re-run (of this job or of all) finds the tag on this
  # commit and starts the release only if there is none and none is running. Tags are not moved
  # or deleted (the tag ruleset).
  release:
    name: tag and release
    needs: [test, homeassistant, firmware, check, release-plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag
      actions: write # start release.yml on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the parent, the tags and the release candidate a release must equal
      - id: plan
        name: The version this push releases
        env:
          BASE: ${{ github.event.before }}
        run: python3 -I tools/release_plan.py tag --base "$BASE" >>"$GITHUB_OUTPUT"
      - name: Annotated tag on the commit CI tested
        if: steps.plan.outputs.tag != '' && steps.plan.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f object="$SHA" \
            -f type=commit -f message="meshcore-home-gateway ${TAG#v}" --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "tagged $SHA as $TAG"
      - name: Start the release on the tag
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          running=$(gh run list --workflow release.yml --branch "$TAG" --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is released already"
          elif [[ $running != 0 ]]; then
            echo "release.yml is running on $TAG already"
          else
            gh workflow run release.yml --ref "$TAG"
            echo "release.yml started on $TAG"
          fi
