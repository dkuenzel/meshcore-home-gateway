# Release (ADR 0013, 0022): a tag vX.Y.Z builds the release files from the tagged commit with the
# same Makefile targets as a local check, attests their build provenance (Sigstore-signed SLSA
# provenance, verifiable with `gh attestation verify`) and publishes them with SHA256SUMS as a
# GitHub release. CI tags a commit on main that changed the version and starts this workflow on
# the tag (a tag its token creates starts no workflow); a tag pushed by hand starts it too. A run
# on a branch is a dry run: it checks, builds and rebuilds, and keeps the files as a workflow
# artifact, without attestation or release.
# The jobs: admit, on a tag, refuses a commit off main, a release that release-due.yml would not
# tag (not main's version commit, before its day, without CI passed on main, or while the workflow
# is disabled), and admits a pre-release on any commit of main that carries its version (#84). It
# lives in the tagged tree, so a commit off main can drop it (SECURITY.md). Then (SUP-002):
# check runs everything CI checks, with the development tools; build makes the
# release files in an environment of the build tools alone (requirements/release.txt), so that no
# test or lint tool runs where they are made; rebuild makes them again on another runner image
# (arm64) and compares them byte for byte; publish, on a tag and after all three, attests and
# releases. Only publish gets the permissions to sign and to release. SLSA Build Level 2
# (docs/development.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: a tag that CI would make
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # whether CI passed on a release, and release-due.yml is enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          persist-credentials: false
          fetch-depth: 0 # main, the version commit and the tags
      - id: plan
        name: On main, and a release on its version commit a day later
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I tools/release_plan.py admit "$TAG" >>"$GITHUB_OUTPUT"
      - name: CI passed on the commit of a release
        if: steps.plan.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          passed=$(gh run list --workflow ci.yml --commit "$SHA" --event push --status success \
            --json databaseId --jq length)
          if [[ $passed == 0 ]]; then
            echo "::error::CI has not passed on $SHA on main"
            exit 1
          fi
      - name: No release while release-due.yml is disabled
        if: steps.plan.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GH_REPO/actions/workflows/release-due.yml" --jq .state)
          if [[ $state != active ]]; then
            echo "::error::release-due.yml is $state: disabling it stops a release, also one tagged by hand"
            exit 1
          fi

  check:
    name: check
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the MQTT broker and GNU gettext for the tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mosquitto gettext
      - name: Everything CI checks
        run: make check

  build:
    name: build
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Release files from the build tools alone, checked against the tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make release VENV=.venv-release REQUIREMENTS=requirements/release.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error

  rebuild:
    name: rebuild and compare
    needs: build
    runs-on: ubuntu-24.04-arm # another runner image: the files depend on no architecture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The release files again, on the arm64 runner
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make release VENV=.venv-release REQUIREMENTS=requirements/release.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: built
      - name: The same bytes as the build job's
        run: diff built/release/SHA256SUMS dist/release/SHA256SUMS

  publish:
    name: attest and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [admit, check, build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the files against their checksums
        run: cd release && sha256sum --check --strict SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # PEP 440 pre-releases: v1.0.0a1, v1.0.0b2, v1.0.0rc1, v1.0.0.dev1; `make release`
          # admits only version forms for which the end of the tag tells (tools/release_notes.py)
          prerelease=()
          if [[ $TAG =~ (a|b|rc|dev)[0-9]+$ ]]; then prerelease=(--prerelease); fi
          # the attestation itself, for verification with any Sigstore client
          cp -- "$BUNDLE" "release/meshcore-home-gateway-${TAG#v}.sigstore.json"
          gh release create "$TAG" --verify-tag --title "meshcore-home-gateway ${TAG#v}" \
            --notes-file release-notes.md "${prerelease[@]}" -- release/*
