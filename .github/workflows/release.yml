# Release (ADR 0013, 0022): a tag vX.Y.Z builds the release files from the tagged commit with the
# same Makefile targets as a local check, attests their build provenance (Sigstore-signed SLSA
# provenance, verifiable with `gh attestation verify`) and publishes them with SHA256SUMS as a
# GitHub release. CI tags a commit on main that changed the version and starts this workflow on
# the tag (a tag its token creates starts no workflow); a tag pushed by hand starts it too. A run
# on a branch is a dry run: it checks, builds and rebuilds, and keeps the files as a workflow
# artifact, without attestation or release.
# The jobs (SUP-002): check runs everything CI checks, with the development tools; build makes the
# release files in an environment of the build tools alone (requirements/release.txt), so that no
# test or lint tool runs where they are made; rebuild makes them again on another runner image
# (arm64) and compares them byte for byte; publish, on a tag and after all three, attests and
# releases. Only publish gets the permissions to sign and to release. SLSA Build Level 2
# (docs/development.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the MQTT broker and GNU gettext for the tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mosquitto gettext
      - name: Everything CI checks
        run: make check

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release files from the build tools alone, checked against the tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make release VENV=.venv-release REQUIREMENTS=requirements/release.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/
            dist/release-notes.md
          if-no-files-found: error

  rebuild:
    name: rebuild and compare
    needs: build
    runs-on: ubuntu-24.04-arm # another runner image: the files depend on no architecture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The release files again, on the arm64 runner
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make release VENV=.venv-release REQUIREMENTS=requirements/release.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: built
      - name: The same bytes as the build job's
        run: diff built/release/SHA256SUMS dist/release/SHA256SUMS

  publish:
    name: attest and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the files against their checksums
        run: cd release && sha256sum --check --strict SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # PEP 440 pre-releases: v1.0.0a1, v1.0.0b2, v1.0.0rc1, v1.0.0.dev1; `make release`
          # admits only version forms for which the end of the tag tells (tools/release_notes.py)
          prerelease=()
          if [[ $TAG =~ (a|b|rc|dev)[0-9]+$ ]]; then prerelease=(--prerelease); fi
          # the attestation itself, for verification with any Sigstore client
          cp -- "$BUNDLE" "release/meshcore-home-gateway-${TAG#v}.sigstore.json"
          gh release create "$TAG" --verify-tag --title "meshcore-home-gateway ${TAG#v}" \
            --notes-file release-notes.md "${prerelease[@]}" -- release/*
