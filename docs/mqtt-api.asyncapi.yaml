{
  "asyncapi": "3.1.0",
  "id": "urn:meshcore-home-gateway:mqtt-api",
  "info": {
    "title": "meshcore-home-gateway MQTT API",
    "version": "2.2.0rc2",
    "description": "The topics the gateway publishes and reads, generated from its interface snapshot by tools/asyncapi.py. docs/mqtt-api.md is normative: it gives what each key means and its type. Every value may be null. `x-values` lists the values the gateway uses at this release, in a key or in the items of a list; within a major version keys and values are only added: ignore a key you do not know, and treat a value you do not know as other.",
    "license": {
      "name": "MIT",
      "url": "https://github.com/dkuenzel/meshcore-home-gateway/blob/main/LICENSE"
    },
    "externalDocs": {
      "url": "https://github.com/dkuenzel/meshcore-home-gateway/blob/v2.2.0rc2/docs/mqtt-api.md"
    }
  },
  "servers": {
    "broker": {
      "host": "{host}",
      "protocol": "mqtt",
      "protocolVersion": "3.1.1",
      "description": "The broker of `[mqtt]`; with `protocol = \"5\"` it speaks MQTT 5.",
      "variables": {
        "host": {
          "description": "`[mqtt] host` and `port`",
          "examples": [
            "broker.example.org:8883"
          ]
        }
      }
    }
  },
  "channels": {
    "add_contact": {
      "address": "{base_topic}/{node_id}/add_contact",
      "messages": {
        "add_contact": {
          "name": "add_contact",
          "summary": "a public key, contact link or contact card, or JSON {\"contact\": \"...\", \"id\": \"...\"}: add a contact to the radio; never retained",
          "payload": {}
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
        }
      }
    },
    "advert": {
      "address": "{base_topic}/{node_id}/advert",
      "messages": {
        "advert": {
          "name": "advert",
          "contentType": "application/json",
          "summary": "an event",
          "payload": {
            "type": "object",
            "properties": {
              "airtime_ms": {},
              "event_type": {
                "x-values": [
                  "failed",
                  "refused",
                  "sent"
                ]
              },
              "id": {},
              "name": {},
              "next_at": {},
              "reason": {
                "x-values": [
                  "advert_location",
                  "airtime_budget",
                  "busy",
                  "clock_ahead",
                  "clock_unknown",
                  "empty",
                  "internal_error",
                  "invalid_request",
                  "invalid_utf8",
                  "messages_waiting",
                  "no_name",
                  "no_radio",
                  "outcome_unknown",
                  "rate_limited",
                  "retained",
                  "too_large",
                  "too_soon",
                  "untested_firmware"
                ]
              }
            }
          }
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
        }
      }
    },
    "advert_send": {
      "address": "{base_topic}/{node_id}/advert/send",
      "messages": {
        "advert_send": {
          "name": "advert_send",
          "summary": "any payload, or JSON {\"id\": \"...\"}: make the radio send its advert once, zero hop; never retained",
          "payload": {}
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
        }
      }
    },
    "availability": {
      "address": "{base_topic}/{node_id}/availability",
      "messages": {
        "availability": {
          "name": "availability",
          "contentType": "text/plain",
          "summary": "text",
          "payload": {
            "type": "string",
            "x-values": [
              "offline",
              "online"
            ]
          }
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
        }
      },
      "description": "The last will of a connection: `offline`, retained, QoS 1."
    },
    "command": {
      "address": "{base_topic}/{node_id}/command",
      "messages": {
        "command": {
          "name": "command",
          "contentType": "application/json",
          "summary": "an event",
          "payload": {
            "type": "object",
            "properties": {
              "args": {},
              "event_type": {},
              "received_at": {},
              "sender_key": {},
              "sender_name": {},
              "sent_at": {}
            }
          }
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
        }
      }
    },
