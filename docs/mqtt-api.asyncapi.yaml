                ],
                "properties": {
                  "ask": {},
                  "ask_types": {},
                  "enabled": {}
                }
              }
            }
          }
        }
      },
      "parameters": {
        "base_topic": {
          "description": "`[mqtt] base_topic`",
          "default": "meshcore"
        },
        "node_id": {
          "description": "`[mqtt] node_id`",
          "default": "radio1"
