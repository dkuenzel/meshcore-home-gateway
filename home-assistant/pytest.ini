# Contract tests against a real Home Assistant (`make ha-test`, docs/testing.md); not part of the
# main suite, which must not depend on Home Assistant.
[pytest]
minversion = 9.0
testpaths = tests
pythonpath = ../src
# respx's plugin would import httpx before Home Assistant, which 2026.11 refuses (it aliases httpx
# to httpx2 on import); its own pytest configuration leaves the plugin out the same way
addopts = -ra --strict-markers --strict-config -p no:respx
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
xfail_strict = true
