# Contract tests against a real Home Assistant (`make ha-test`, docs/testing.md); not part of the
# main suite, which must not depend on Home Assistant.
[pytest]
minversion = 9.0
testpaths = tests
pythonpath = ../src
addopts = -ra --strict-markers --strict-config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
xfail_strict = true
