          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro what(v) -%}
              {#- Translators: what happened to a contact, after its name -#}
              {%- if v == 'added' -%}_("added to the radio")
              {%- elif v == 'removed' -%}_("removed from the radio")
              {%- elif v == 'hidden' -%}_("hidden: its device was deleted in Home Assistant")
              {%- elif v == 'shown' -%}_("shown again")
              {%- elif v == 'refused' -%}_("request refused")
              {%- elif v == 'failed' -%}_("request failed")
              {%- elif v == 'excluded' -%}_("no longer asked for position and battery")
              {%- elif v == 'included' -%}_("asked for position and battery")
              {%- elif v == 'position_in_advert' -%}_("broadcasts its position to everyone in range")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro why(v) -%}
              {%- if v == 'invalid_request' -%}_("invalid request")
              {%- elif v == 'invalid_link' -%}_("no key, link or contact card")
              {%- elif v == 'unsupported_link' -%}_("a link of another kind")
              {%- elif v == 'unsupported_type' -%}_("unsupported node type")
              {%- elif v == 'unknown_node' -%}_("no heard node or contact of that name")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'management_off' -%}_("contact management is off")
              {%- elif v == 'own_key' -%}_("the gateway's own key")
              {%- elif v == 'protected' -%}_("a target or command sender")
              {%- elif v == 'busy' -%}_("too many requests waiting")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'untested_firmware' -%}_("firmware not tested")
              {%- elif v == 'rate_limited' -%}_("too many requests")
              {%- elif v == 'already_contact' -%}_("already a contact")
              {%- elif v == 'look_alike' -%}_("another contact has the same key prefix")
              {%- elif v == 'table_full' -%}_("contact table full")
              {%- elif v == 'not_confirmed' -%}_("the radio's table does not show it")
              {%- elif v == 'outcome_unknown' -%}_("outcome unknown: the next table read tells")
              {%- elif v == 'not_a_companion' -%}_("never asked for position and battery")
              {%- elif v == 'too_many' -%}_("too many keys stored")
              {%- elif v == 'not_saved' -%}_("in effect, not stored yet")
              {%- elif v == 'not_forgotten' -%}_("in effect, history not deleted")
              {%- elif v == 'state_unwritable' -%}_("cannot be stored")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("request not UTF-8")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'event.@gw@_contact' -%}
              {%- set kind = state_attr(e, 'event_type') -%}
              {%- set reason = state_attr(e, 'reason') -%}
              {%- set who = m(state_attr(e, 'name') or state_attr(e, 'prefix') or '?') -%}
              {%- set ns = namespace(page=false) -%}
              {%- for x in ["@chats@"] if x.key and x.key == state_attr(e, 'key') -%}{%- set ns.page = true -%}{%- endfor -%}
              {#- Translators: Return (↵) is the keyboard's key: the word the phone keyboards of your language show, with the sign ↵, and the same word as in the name beside a chat's Send button (Return, then Send) -#}
              <div>_("Paste a key or contact link into the field above, then tap Return (↵).")</div>
              {%- if is_state('binary_sensor.@gw@_radio', 'unavailable') %}
              <div>_("The gateway is offline: this shows again when it is back.")</div>
              {%- elif kind is none %}
              <div>_("No contact event yet.")</div>
              {%- elif kind in ['refused', 'failed'] %}
              <div><ha-alert alert-type="warning"><b>{{ m(state_attr(e, 'name') or state_attr(e, 'prefix') or '?') }}</b> {{ what(kind) }}{% if reason %} ({{ why(reason) }}){% endif %} · {{ when(states(e)) }}</ha-alert></div>
              {%- else %}
              <div><b>{{ m(state_attr(e, 'name') or state_attr(e, 'prefix') or '?') }}</b> {{ what(kind) }} · {{ when(states(e)) }}</div>
              {%- if kind == 'added' and state_attr(e, 'type') == 'chat' and not ns.page %}
              {#- Translators: who is a contact's name #}
              <div>_("To write to {who} here, your administrator makes the dashboard again.")</div>
              {%- endif %}
              {%- endif %}
              {#- Translators: Return (↵) is the keyboard's key: the same word as in the name beside a chat's Send button (Return, then Send); Add at once names the list above as its label begins #}
              <details><summary>_("How adding works")</summary><ul><li>_("Picking a node in the list Add at once adds it to the radio at once.")</li><li>_("A key, or a contact link from the MeshCore app (Share contact), is added when you tap Return (↵).")</li><li>_("A key or link copied from a chat works here too.")</li><li>_("The line above says what happened, also why a request did not work.")</li><li>_("Help explains each word.") <a href="./help">_("Help")</a></li></ul></details>
          - type: heading
