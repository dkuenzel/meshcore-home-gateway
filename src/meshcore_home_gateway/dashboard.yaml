  - title: _("Map")
    path: map
    subview: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
# @if trackers
          - type: map
            entities: ["@trackers@"]
            hours_to_show: 24
            theme_mode: auto
            grid_options:
              columns: full
              rows: 8
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("How to read the map")</summary><ul><li>_("Each marker with the first letters of a name is where a device is now; the line behind it, with a dot for each position, shows where it went in the last 24 hours.")</li><li>_("A device whose position is not current has no marker, only its line, whose last dot is where it was last, until that is more than 24 hours ago.")</li><li>_("Tap a marker or a dot for its name. Where everyone is, below, says it in words.")</li></ul></details>
# @else
          - type: markdown
            text_only: true
            content: |-
              <div><ha-alert alert-type="info">_("Nobody had a position when this dashboard was made. People show here once your administrator makes the dashboard again.")</ha-alert></div>
              <details><summary>_("Why the map is empty")</summary><ul><li>_("The map shows the devices that had a position when the dashboard was made.")</li><li>_("Where everyone is, below, lists everyone with a position now.")</li></ul></details>
# @end
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set listed = ["@trackers@"] -%}
              {#- a listed tracker counts by its contact's key (the device's serial number): with a contact shared by two gateways, the ID written from the state file can be the other gateway's tracker of the same node -#}
              {%- set keys = listed | map('device_attr', 'serial_number') | reject('none') | list -%}
              {%- set ns = namespace(names=[], foreign=[], own=[]) -%}
              {%- for t in integration_entities('mqtt') | select('match', 'device_tracker\\.') if gw and device_attr(t, 'via_device_id') == gw -%}
              {%- set ns.own = ns.own + [device_attr(t, 'serial_number')] -%}
              {%- if t not in listed and device_attr(t, 'serial_number') not in keys -%}{%- set ns.names = ns.names + [device_attr(t, 'name_by_user') or device_attr(t, 'name') or t] -%}{%- endif -%}
              {%- endfor -%}
              {#- a listed tracker of another gateway, of a node this gateway has no tracker of: two nodes of one name (A second gateway) -#}
              {%- for t in listed if gw and states[t] is not none and device_attr(t, 'via_device_id') != gw and device_attr(t, 'serial_number') not in ns.own -%}{%- set ns.foreign = ns.foreign + [device_attr(t, 'name_by_user') or device_attr(t, 'name') or t] -%}{%- endfor -%}
              {%- if ns.names or ns.foreign -%}
              {%- set names = m(ns.names | join(', ')) -%}{%- set others = m(ns.foreign | join(', ')) -%}
              {%- if ns.names %}
              {#- Translators: names are the contacts' names, separated by commas #}
              <div><ha-alert alert-type="info">_("Not on this map: {names}. Ask your administrator to make the dashboard again.")</ha-alert></div>
              {%- endif %}
              {%- if ns.foreign %}
              {#- Translators: others are contacts' names, separated by commas: nodes of another gateway that the map shows under the names of this gateway's contacts #}
              <div><ha-alert alert-type="warning"><b>_("This map shows {others} of another gateway under this gateway's names.")</b><br>_("For your administrator: give each gateway a contact prefix of its own, then make this dashboard again.") <a href="@guide@#a-second-gateway">_("How, in the guide")</a></ha-alert></div>
              {%- endif %}
              <details><summary>_("Why the map misses someone")</summary><ul><li>_("The map lists the devices that had a position when the dashboard was made; your administrator makes it again for the others.")</li><li>_("With two gateways, a contact of the same name on both can show the other gateway's device.")</li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Where everyone is")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro place(v) -%}
              {%- if v == 'home' -%}_("at home")
              {%- elif v == 'not_home' -%}_("away")
              {%- elif v == 'unavailable' -%}_("position not current")
              {%- elif v == 'unknown' -%}_("no position yet")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for t in integration_entities('mqtt') | select('match', 'device_tracker\\.') if gw is not none and device_attr(t, 'via_device_id') == gw -%}
              {%- set ns.rows = ns.rows + [dict(name=device_attr(t, 'name_by_user') or device_attr(t, 'name') or t, place=states(t), home=0 if is_state(t, 'home') else 1, since=(states[t].last_changed | string) if states[t] is not none else '')] -%}
              {%- endfor -%}
              {%- set telemetry = state_attr('sensor.@gw@_configuration', 'telemetry') -%}
              {%- if states['binary_sensor.@gw@_radio'] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif not ns.rows and telemetry is mapping and telemetry.get('enabled') == false -%}
              <div>_("Nobody shares a position yet. Asking for position and battery is off in this home's settings (your administrator).")</div>
              {%- elif not ns.rows -%}
              <div>_("Nobody shares a position yet. Turn on Ask for position and battery for a person who agrees (Contacts).")</div>
              {%- else -%}
              {#- Translators: since is a time, such as 10:31 or yesterday 10:31 -#}
              <table role="presentation" width="100%">{%- for r in ns.rows | sort(attribute='since', reverse=true) | sort(attribute='home') -%}{%- set zone = m(r.place) -%}{%- set since = when(r.since) -%}<tr><td><b>{{ m(r.name) }}</b></td><td>{% if r.place in ['home', 'not_home', 'unavailable', 'unknown'] %}{{ place(r.place) }}{% else %}_("at {zone}"){% endif %}</td><td align="right"><small>_("since {since}")</small></td></tr>{%- endfor -%}</table>
              {%- endif %}
              <details><summary>_("Why someone is missing or not current")</summary><ul><li><b>_("no position yet")</b>: _("GPS off, location not allowed in the app, out of range, or asking is off (Contacts).")</li><li><b>_("position not current")</b>: _("A position counts for an hour after the last answer.")</li><li><b>_("at home")</b>, <b>_("away")</b>: _("Where the device was at its last answer; a place's name when it was in another zone of Home Assistant.")</li><li>_("Positions come from the person's device when the gateway asks it (Ask for position and battery), or from its adverts.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What the map shows")</summary><ul><li>_("Where the household's devices were in the last 24 hours.")</li><li>_("Everyone who uses Home Assistant sees this map and its history.")</li><li>_("Someone missing: see Where everyone is.")</li></ul><p><a href="./help">_("Help")</a></p></details>
  - title: _("Gateway")
    path: gateway
    subview: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Gateway")
            badges:
              - type: button
                text: _("Settings")
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: ./settings
              - type: button
                text: _("Help")
                icon: mdi:help-circle
                tap_action:
                  action: navigate
                  navigation_path: ./help
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- macro profile(v) -%}
              {#- Translators: the state of the radio's settings as the gateway keeps them -#}
              {%- if v == 'ok' -%}_("as wanted")
              {%- elif v == 'written' -%}_("written")
              {%- elif v == 'drift' -%}_("changed by someone")
              {%- elif v == 'differs' -%}_("differs: only watched")
              {%- elif v == 'problem' -%}_("could not be set")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}_("no value yet")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro paused(v) -%}
              {#- Translators: why asking for position and battery is paused, after paused: -#}
              {%- if v == 'first_start' -%}_("it starts within the hour")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'exclusions_unreadable' -%}_("the list of people not to ask cannot be read")
              {%- elif v == 'auto_add' -%}_("the radio adds contacts by itself")
              {%- elif v == 'radio_airtime' -%}_("the radio sent a lot in the last hour")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro part(v) -%}
              {%- if v == 'radio' -%}_("Radio link")
              {%- elif v == 'history' -%}_("Message history")
              {%- elif v == 'state_file' -%}_("State file")
              {%- elif v == 'exclusions' -%}_("List of people not to ask")
              {%- elif v == 'errors' -%}_("Program errors, last hour")
              {%- elif v == 'lag' -%}_("Slowest response, last hour")
              {%- elif v == 'disk' -%}_("Free disk")
              {%- elif v == 'clock' -%}_("Radio clock")
              {%- elif v == 'profile' -%}_("Radio settings")
              {%- elif v == 'asking' -%}_("Asking for position and battery")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro parts(v) -%}{%- for p in v -%}{{ part(p) }}{% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {#- Translators: how far the radio's clock is off: mins, hours and days are whole numbers -#}
              {%- macro span(v) -%}{%- if v < 120 -%}_("{mins} min"){%- elif v < 2880 -%}_("{hours} h"){%- else -%}_("{days} days"){%- endif -%}{%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set e = 'binary_sensor.@gw@_degraded' -%}
              {%- set link = states(radio) -%}
              {%- set history = state_attr(e, 'history') -%}{%- set file = state_attr(e, 'state_file') -%}{%- set kept = state_attr(e, 'exclusions') -%}
              {%- set errors = state_attr(e, 'errors_1h') | int(0) -%}{%- set dropped = state_attr(e, 'events_dropped_1h') | int(0) -%}
              {%- set lag = state_attr(e, 'loop_lag_max_s') -%}{%- set disk = state_attr(e, 'disk_free_mb') -%}
              {%- set slow = num(lag if lag is number else none, 1) -%}{%- set free = m(disk | int if disk is number else '') -%}
              {%- set offset = states('sensor.@gw@_radio_clock_offset') | float(0) -%}
              {%- set mins = (offset | abs / 60) | int -%}{%- set hours = (mins / 60) | int -%}{%- set days = (hours / 24) | int -%}{%- set d = span(mins) -%}
              {%- set status = states('sensor.@gw@_profile') -%}
              {%- set asking = states('sensor.@gw@_telemetry_status') -%}{%- set reason = state_attr('sensor.@gw@_telemetry_status', 'reason') -%}{%- set why = paused(reason) -%}
              {%- set left = states('sensor.@gw@_airtime_available') | float(none) -%}{%- set budget = state_attr('sensor.@gw@_airtime_available', 'budget_s_per_hour') | float(none) -%}
              {%- set spare = num(left, 0) -%}{%- set hour = num(budget, 0) -%}
              {#- the messages on their way, and those of them queued over a minute ago, as the status line counts them (HC 13) -#}
              {%- set p = 'sensor.@gw@_pending_messages' -%}
              {%- set ns = namespace(waiting=0, look=[]) -%}
              {%- for q in (state_attr(p, 'messages') or []) if q is mapping and q.get('step') == 'queued' -%}
              {%- set t = (q.get('queued_at') or '') | as_datetime(default=none) -%}
              {%- if t is not none and now() - t > timedelta(seconds=60) -%}{%- set ns.waiting = ns.waiting + 1 -%}{%- endif -%}
              {%- endfor -%}
              {%- set total = state_attr(p, 'total') | int(0) -%}{%- set waiting = ns.waiting | int -%}
              {#- the parts that need a look, red or yellow on Overview, in the table's order -#}
              {%- if link != 'on' or is_state('binary_sensor.@gw@_radio_link_contested', 'on') -%}{%- set ns.look = ns.look + ['radio'] -%}{%- endif -%}
              {%- if history == 'broken' -%}{%- set ns.look = ns.look + ['history'] -%}{%- endif -%}
              {%- if file not in [none, 'ok'] -%}{%- set ns.look = ns.look + ['state_file'] -%}{%- endif -%}
              {%- if kept not in [none, 'ok'] -%}{%- set ns.look = ns.look + ['exclusions'] -%}{%- endif -%}
              {%- if errors > 0 -%}{%- set ns.look = ns.look + ['errors'] -%}{%- endif -%}
              {%- if lag is number and lag >= 1 -%}{%- set ns.look = ns.look + ['lag'] -%}{%- endif -%}
              {%- if disk is number and disk < 100 -%}{%- set ns.look = ns.look + ['disk'] -%}{%- endif -%}
              {%- if offset | abs >= 300 -%}{%- set ns.look = ns.look + ['clock'] -%}{%- endif -%}
              {%- if status in ['problem', 'drift'] -%}{%- set ns.look = ns.look + ['profile'] -%}{%- endif -%}
              {%- if asking == 'paused' and reason not in ['no_radio', 'first_start', 'radio_airtime'] -%}{%- set ns.look = ns.look + ['asking'] -%}{%- endif -%}
              {%- set n = ns.look | count -%}{%- set named = parts(ns.look) -%}
              {%- if states[radio] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- else -%}
              {%- if link == 'unavailable' %}
              <div>_("The gateway is offline: its parts report again when it is back.")</div>
              {%- elif n == 0 %}
              <div>_("All parts working.")</div>
              {%- elif n == 1 %}
              {#- Translators: named is the part that needs a look, such as Free disk #}
              <div>_("One part needs a look: {named}.")</div>
              {%- else %}
              {#- Translators: n is a whole number, 2 or more; named are the parts, separated by commas #}
              <div>_("{n} parts need a look: {named}.")</div>
              {%- endif %}
              {#- Translators: the parts of the gateway and their states. slow is in seconds and free in MB, such as 0.4 and 5120, written with this language's decimal mark; d how far the clock is off, such as 12 min; why why asking is paused; total and waiting are whole numbers; spare and hour seconds of airtime, such as 9 and 36 #}
              <table><tr><th>_("Part")</th><th>_("State")</th></tr><tr><td>_("Radio link")</td><td>{% if link == 'on' and is_state('binary_sensor.@gw@_radio_link_contested', 'on') %}_("taken over in the last hour"){% elif link == 'on' %}_("connected"){% elif link == 'off' %}_("disconnected"){% elif link == 'unavailable' %}_("gateway offline"){% else %}_("no value yet"){% endif %}</td></tr><tr><td>_("Message history")</td><td>{% if history == 'ok' %}_("working"){% elif history == 'off' %}_("off"){% elif history == 'broken' %}_("broken"){% elif history is none %}_("no value yet"){% else %}<code>{{ m(history) }}</code>{% endif %}</td></tr><tr><td>_("State file")</td><td>{% if file == 'ok' %}_("working"){% elif file is none %}_("no value yet"){% else %}_("cannot be written"){% endif %}</td></tr><tr><td>_("List of people not to ask")</td><td>{% if kept == 'ok' %}_("working"){% elif kept == 'unreadable' %}_("unreadable"){% elif kept is none %}_("no value yet"){% else %}_("not saved"){% endif %}</td></tr><tr><td>_("Program errors, last hour")</td><td>{{ m(errors | string) }}</td></tr><tr><td>_("Slowest response, last hour")</td><td>{% if slow %}_("{slow} s"){% else %}_("no value yet"){% endif %}</td></tr><tr><td>_("Free disk")</td><td>{% if free %}_("{free} MB"){% else %}_("no value yet"){% endif %}</td></tr><tr><td>_("Events dropped, last hour")</td><td>{{ m(dropped | string) }}</td></tr><tr><td>_("Radio clock")</td><td>{% if states('sensor.@gw@_radio_clock_offset') in ['unknown', 'unavailable'] %}_("no value yet"){% elif offset | abs < 300 %}_("on time"){% elif offset > 0 %}_("{d} ahead"){% else %}_("{d} behind"){% endif %}</td></tr><tr><td>_("Radio settings")</td><td>{{ profile(status) }}</td></tr><tr><td>_("Asking for position and battery")</td><td>{% if asking == 'on' %}_("on"){% elif asking == 'off' %}_("off"){% elif asking == 'paused' %}_("paused: {why}"){% elif asking == 'unsupported' %}_("not supported by the radio"){% else %}_("no value yet"){% endif %}</td></tr><tr><td>_("Messages on their way")</td><td>{% if states[p] is none %}–{% else %}_("{total} ({waiting} waiting over a minute)"){% endif %}</td></tr><tr><td>_("Airtime left this hour")</td><td>{% if spare and hour %}_("{spare} of {hour} s"){% else %}_("no value yet"){% endif %}</td></tr></table>
              {%- endif %}
              <details><summary>_("What each part means and what to do")</summary><ul><li><b>_("Radio link")</b>: _("The gateway's connection to its radio. Disconnected: check the radio's power and cable. Taken over: see the red card on Overview.")</li><li><b>_("Message history")</b>: _("Off: your administrator turned it off. Broken: chats show no new messages until the gateway restarts.")</li><li><b>_("State file")</b>: _("Cannot be written: the disk is full or read-only.")</li><li><b>_("List of people not to ask")</b>: _("Unreadable: asking is paused until the file is fixed or deleted. Not saved: a restart would forget the latest change.")</li><li><b>_("Program errors, last hour")</b>: _("Errors the gateway caught; it runs on, and its log has the details.")</li><li><b>_("Slowest response, last hour")</b>: _("1 s or more: the computer gives the gateway too little time, such as during a backup.")</li><li><b>_("Free disk")</b>: _("Below 100 MB: free some space.")</li><li><b>_("Events dropped, last hour")</b>: _("Events lost while the broker was away; no fault of the gateway.")</li><li><b>_("Radio clock")</b>: _("Far off: check the computer's clock first.")</li><li><b>_("Radio settings")</b>: _("Whether the radio has the settings this home needs; Radio settings below shows each one.")</li><li><b>_("Asking for position and battery")</b>: _("Paused: the reason follows; it starts again by itself, or your administrator acts.")</li><li><b>_("Messages on their way")</b>: _("Messages the gateway took and has not delivered yet. Waiting over a minute: the radio or the airtime holds them up.")</li><li><b>_("Airtime left this hour")</b>: _("What the gateway may still send this hour; messages wait when it is used up.")</li><li><b>_("no value yet")</b>: _("The gateway has not reported it since Home Assistant started.")</li><li>_("Tell your administrator the time and what this table says.")</li></ul></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Radio")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set cfg = state_attr('sensor.@gw@_configuration', 'radio') -%}
              {%- set transport = cfg.get('transport') if cfg is mapping else none -%}
              {%- set mhz = num(state_attr(radio, 'frequency_mhz')) -%}{%- set khz = num(state_attr(radio, 'bandwidth_khz')) -%}{%- set dbm = num(state_attr(radio, 'tx_power_dbm')) -%}{%- set cr = num(state_attr(radio, 'coding_rate')) -%}
              {%- if states[radio] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {#- offline, Home Assistant drops the attributes: every value would read as never reported -#}
              {%- elif is_state(radio, 'unavailable') -%}
              <div>_("The gateway is offline: this shows again when it is back.")</div>
              {%- else -%}
              {#- Translators: the facts of the gateway's radio: mhz and khz are numbers such as 869.618 and 62.5, written with this language's decimal mark, cr the coding rate's second number, such as 8 in 4/8, dbm the transmit power, such as 22 -#}
              <table><tr><td>_("Name")</td><td>{{ m(state_attr(radio, 'radio_name') or '–') }}</td></tr><tr><td>_("Model")</td><td>{{ m(state_attr(radio, 'model') or '–') }}</td></tr><tr><td>_("Firmware")</td><td>{{ m(state_attr(radio, 'firmware') or '–') }}</td></tr><tr><td>_("Frequency")</td><td>{% if mhz %}_("{mhz} MHz"){% else %}–{% endif %}</td></tr><tr><td>_("Bandwidth")</td><td>{% if khz %}_("{khz} kHz"){% else %}–{% endif %}</td></tr><tr><td>_("Spreading factor")</td><td>{{ m(state_attr(radio, 'spreading_factor') or '–') }}</td></tr><tr><td>_("Coding rate")</td><td>{% if cr %}_("4/{cr}"){% else %}–{% endif %}</td></tr><tr><td>_("Transmit power")</td><td>{% if dbm %}_("{dbm} dBm"){% else %}–{% endif %}</td></tr><tr><td>_("Key")</td><td>{{ m((state_attr(radio, 'public_key') or '')[:8] or '–') }}</td></tr><tr><td>_("Connected by")</td><td>{% if transport == 'serial' %}_("USB"){% elif transport == 'tcp' %}_("network"){% else %}–{% endif %}</td></tr></table>
              {%- endif %}
              <details><summary>_("What these values mean")</summary><ul><li>_("Name, model and firmware: this home's radio, as it reports itself.")</li><li>_("Frequency, bandwidth, spreading factor and coding rate: every radio that should hear this one needs the same.")</li><li>_("Key: the first digits of the radio's public key; the MeshCore app shows them too.")</li><li>_("Connected by: how the gateway reaches the radio, with a cable (USB) or over the network.")</li></ul></details>
          - type: entities
            entities:
              - entity: sensor.@gw@_noise_floor
                # Translators: the label of the radio's noise floor, what it hears when nobody sends
                name: _("Background noise")
              - entity: sensor.@gw@_battery
                # Translators: the label of the battery of this home's radio
                name: _("Radio battery")
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What noise and battery say")</summary><ul><li>_("Background noise: lower is quieter; compare it with the last days.")</li><li>_("Radio battery: a radio on USB power shows its charging voltage.")</li><li>_("Tap a row for its history.")</li></ul></details>
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.@gw@_airtime
                # Translators: a line of a graph: how long the gateway's own messages took on air
                # in the last hour
                name: _("Gateway's messages, last hour")
              - entity: sensor.@gw@_radio_airtime
                # Translators: a line of a graph: how long the radio sent in the last hour, its
                # adverts and acknowledgements included
                name: _("Everything the radio sent, last hour")
          - type: markdown
            text_only: true
            content: |-
              {%- set hour = state_attr('sensor.@gw@_airtime_available', 'budget_s_per_hour') | int(0) -%}
              {#- Translators: hour is a whole number of seconds, such as 36 -#}
              <details><summary>_("What the graph shows")</summary><ul><li>{% if hour > 0 %}_("Airtime: the law allows a radio only a share of each hour. The gateway keeps its own messages within {hour} s an hour; messages wait when it is used up."){% else %}_("Airtime: the law allows a radio only a share of each hour. The gateway keeps its own messages within its budget; messages wait when it is used up."){% endif %}</li><li>_("The second line also counts the radio's adverts, acknowledgements and repeats.")</li></ul></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Radio settings")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- macro profile(v) -%}
              {#- Translators: the state of the radio's settings as the gateway keeps them -#}
              {%- if v == 'ok' -%}_("as wanted")
              {%- elif v == 'written' -%}_("written")
              {%- elif v == 'drift' -%}_("changed by someone")
              {%- elif v == 'differs' -%}_("differs: only watched")
              {%- elif v == 'problem' -%}_("could not be set")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}_("no value yet")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro status(v) -%}
              {#- Translators: what happened to one radio setting at the last connect -#}
              {%- if v == 'ok' -%}_("as wanted")
              {%- elif v == 'written' -%}_("written")
              {%- elif v == 'drift' -%}_("changed on the radio")
              {%- elif v == 'differs' -%}_("differs: only watched")
              {%- elif v == 'failed' -%}_("refused by the radio")
              {%- elif v == 'not_taken' -%}_("not taken by the radio")
              {%- elif v == 'not_converging' -%}_("given up")
              {%- elif v == 'unsupported' -%}_("not supported")
              {%- elif v == 'disabled' -%}_("turned off in the firmware")
              {%- elif v == 'unmanaged' -%}_("left as found")
              {%- elif v == 'unknown' -%}_("not reported")
              {%- elif v in ['', none] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro watched(v) -%}
              {#- Translators: how the gateway keeps the radio's settings: managed, it keeps them as this home needs them; only watched, it reports them and changes nothing -#}
              {%- if v == true -%}_("only watched")
              {%- else -%}_("managed")
              {%- endif -%}
              {%- endmacro -%}
              {%- macro audience(v) -%}
              {#- Translators: who may ask this home's radio for its battery, position or readings -#}
              {%- if v == 'deny' -%}_("never")
              {%- elif v == 'contacts' -%}_("contacts you allowed")
              {%- elif v == 'all' -%}_("every contact")
              {%- elif v in ['', none] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro shown(v) -%}
              {#- a setting's value: yes or no (before a number: 1 == true in Jinja), a number, a name or a list of codes -#}
              {%- if v is none -%}–
              {%- elif v is boolean and v -%}_("yes")
              {%- elif v is boolean -%}_("no")
              {%- elif v is number -%}{{ num(v) }}
              {%- elif v is string -%}{{ m(v) }}
              {%- elif v is sequence and v | count == 0 -%}_("none")
              {%- elif v is sequence -%}<code>{{ m(v | join(', ')) }}</code>
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'sensor.@gw@_profile' -%}
              {%- set s = state_attr(e, 'settings') -%}
              {%- set rank = {'deny': 0, 'contacts': 1, 'all': 2} -%}{%- set words = ['deny', 'contacts', 'all'] -%}
              {%- set ns = namespace(rows=[]) -%}
              {#- the radio's own telemetry permissions as they act: base for the battery, base and location for the position, base and environment for the readings (D-58) -#}
              {%- for side in ['live', 'desired'] -%}
              {%- set t = (s.get('telemetry') or {}).get(side) if s is mapping and (s.get('telemetry') or {}) is mapping else none -%}
              {%- set base = t.get('base') if t is mapping else none -%}
              {%- set cut = namespace(at=[]) -%}
              {%- for other in ['location', 'environment'] -%}
              {%- set o = t.get(other) if t is mapping else none -%}
              {%- set cut.at = cut.at + [words[[rank[base], rank[o]] | min] if base in rank and o in rank else (o if base in rank else base)] -%}
              {%- endfor -%}
              {%- set ns.rows = ns.rows + [[base] + cut.at] -%}
              {%- endfor -%}
              {%- set tstate = ((s.get('telemetry') or {}).get('state')) if s is mapping and (s.get('telemetry') or {}) is mapping else none -%}
              {%- macro advert(v) -%}
              {#- whether the radio's adverts carry its position (advert_location) -#}
              {%- if v == 'share' -%}_("yes")
              {%- elif v == 'none' -%}_("no")
              {%- elif v is none -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro row(k) -%}{%- set x = s.get(k) if s is mapping and s.get(k) is mapping else {} -%}<td>{{ shown(x.get('live')) }}</td><td>{{ shown(x.get('desired')) }}</td><td>{{ status(x.get('state')) }}</td>{%- endmacro -%}
              {%- macro adverts(k) -%}{%- set x = s.get(k) if s is mapping and s.get(k) is mapping else {} -%}<td>{{ advert(x.get('live')) }}</td><td>{{ advert(x.get('desired')) }}</td><td>{{ status(x.get('state')) }}</td>{%- endmacro -%}
              {#- offline, Home Assistant drops the attributes: the settings would read as never reported -#}
              {%- if is_state('binary_sensor.@gw@_radio', 'unavailable') -%}
              <div>_("The gateway is offline: this shows again when it is back.")</div>
              {%- elif states[e] is none or s is not mapping -%}
              <div>_("The gateway has not reported the radio's settings yet.")</div>
              {%- else -%}
              {%- set mode = watched(state_attr(e, 'observing')) -%}{%- set state = profile(states(e)) -%}
              {#- Translators: the radio's settings: mode is managed or only watched, state how they are now, such as changed by someone -#}
              <div>_("Mode: {mode}. State: {state}.")</div>
              <table><tr><th>_("Setting")</th><th>_("On the radio")</th><th>_("Wanted")</th><th>_("State")</th></tr><tr><td>_("Contacts added only by hand")</td>{{ row('manual_add') }}</tr><tr><td>_("Contact types the radio adds by itself")</td>{{ row('autoadd') }}</tr><tr><td>_("Who may ask this radio for its battery")</td><td>{{ audience(ns.rows[0][0]) }}</td><td>{{ audience(ns.rows[1][0]) }}</td><td>{{ status(tstate) }}</td></tr><tr><td>_("Who may ask this radio for its position")</td><td>{{ audience(ns.rows[0][1]) }}</td><td>{{ audience(ns.rows[1][1]) }}</td><td>{{ status(tstate) }}</td></tr><tr><td>_("Who may ask this radio for its readings")</td><td>{{ audience(ns.rows[0][2]) }}</td><td>{{ audience(ns.rows[1][2]) }}</td><td>{{ status(tstate) }}</td></tr><tr><td>_("Position in the radio's adverts")</td>{{ adverts('advert_location') }}</tr><tr><td>_("Duty cycle")</td>{{ row('duty_cycle_percent') }}</tr><tr><td>_("Radio name")</td>{{ row('name') }}</tr></table>
              {%- endif %}
              <details><summary>_("What the radio settings are")</summary><ul><li>_("The gateway keeps a few radio settings as this home needs them and writes them back when the radio drifts. Your administrator sets them.")</li><li>_("Wanted: – means the gateway leaves the setting as it finds it.")</li><li>_("A radio answers only contacts in its own table, and only when the battery row lets them in: the position and readings rows can only narrow it.")</li><li>_("Help explains the words of the State column.") <a href="./help">_("Help")</a></li></ul></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Latest of each kind")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro what(v) -%}
              {#- Translators: what happened to a contact, after its name -#}
              {%- if v == 'added' -%}_("added to the radio")
              {%- elif v == 'removed' -%}_("removed from the radio")
              {%- elif v == 'hidden' -%}_("hidden: its device was deleted in Home Assistant")
              {%- elif v == 'shown' -%}_("shown again")
              {%- elif v == 'refused' -%}_("request refused")
              {%- elif v == 'failed' -%}_("request failed")
              {%- elif v == 'excluded' -%}_("no longer asked for position and battery")
              {%- elif v == 'included' -%}_("asked for position and battery")
              {%- elif v == 'position_in_advert' -%}_("broadcasts its position to everyone in range")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro status(v) -%}
              {#- Translators: what happened to one radio setting at the last connect -#}
              {%- if v == 'ok' -%}_("as wanted")
              {%- elif v == 'written' -%}_("written")
              {%- elif v == 'drift' -%}_("changed on the radio")
              {%- elif v == 'differs' -%}_("differs: only watched")
              {%- elif v == 'failed' -%}_("refused by the radio")
              {%- elif v == 'not_taken' -%}_("not taken by the radio")
              {%- elif v == 'not_converging' -%}_("given up")
              {%- elif v == 'unsupported' -%}_("not supported")
              {%- elif v == 'disabled' -%}_("turned off in the firmware")
              {%- elif v == 'unmanaged' -%}_("left as found")
              {%- elif v == 'unknown' -%}_("not reported")
              {%- elif v in ['', none] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro setting(v) -%}
              {%- if v == 'manual_add' -%}_("Contacts added only by hand")
              {%- elif v == 'autoadd' -%}_("Contact types the radio adds by itself")
              {%- elif v == 'telemetry' -%}_("Who may ask this radio for its battery")
              {%- elif v == 'advert_location' -%}_("Position in the radio's adverts")
              {%- elif v == 'duty_cycle_percent' -%}_("Duty cycle")
              {%- elif v == 'name' -%}_("Radio name")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {#- the reasons of mqtt-api.md, Commands (core.commands.Rejection); one added later stays a code -#}
              {%- macro why(v) -%}
              {#- Translators: why the gateway refused a command, after the command's word -#}
              {%- if v == 'sender_unknown' -%}_("sender not a contact")
              {%- elif v == 'sender_ambiguous' -%}_("another contact has the same key prefix")
              {%- elif v == 'sender_not_allowed' -%}_("sender not allowed")
              {%- elif v == 'sender_unverified' -%}_("sender not checked yet")
              {%- elif v == 'state_unwritable' -%}_("cannot be stored")
              {%- elif v == 'broker_unavailable' -%}_("broker unreachable")
              {%- elif v == 'replay' -%}_("an old command again")
              {%- elif v == 'too_old' -%}_("too old")
              {%- elif v == 'from_the_future' -%}_("dated in the future")
              {%- elif v == 'code_missing' -%}_("no code")
              {%- elif v == 'code_invalid' -%}_("wrong code")
              {%- elif v == 'code_reused' -%}_("code used already")
              {%- elif v == 'code_locked' -%}_("too many wrong codes")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set c = 'event.@gw@_contact' -%}{%- set t = 'event.@gw@_telemetry' -%}{%- set s = 'event.@gw@_setting' -%}{%- set n = 'event.@gw@_node' -%}{%- set k = 'event.@gw@_command' -%}{%- set r = 'event.@gw@_message' -%}
              {#- a refused command is only on received (command.accepted false), which the next message of any kind replaces: it shows while it came after the newest accepted one, until then -#}
              {%- set q = state_attr(r, 'command') -%}{%- set at = states(r) | as_datetime(default=none) -%}{%- set last = states(k) | as_datetime(default=none) -%}
              {%- set refused = q is mapping and q.get('accepted') == false and at is not none and (last is none or not state_attr(k, 'event_type') or at > last) -%}
              {%- if refused -%}
              {%- set word = m(q.get('word')) -%}{%- set sender = m(state_attr(r, 'sender_name') or (state_attr(r, 'sender_key') or state_attr(r, 'sender_prefix') or '')[:8] or '?') -%}{%- set reason = why(q.get('reason')) -%}
              {%- else -%}
              {%- set word = m(state_attr(k, 'event_type')) -%}{%- set sender = m(state_attr(k, 'sender_name') or (state_attr(k, 'sender_key') or '')[:8] or '?') -%}
              {%- endif -%}
              {%- if states['binary_sensor.@gw@_radio'] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {#- offline, Home Assistant drops the events' attributes: each would read as none yet -#}
              {%- elif is_state('binary_sensor.@gw@_radio', 'unavailable') -%}
              <div>_("The gateway is offline: this shows again when it is back.")</div>
              {%- else -%}
              {#- Translators: the newest event of each kind; sender is the name of a contact that sent a command, word a command word, reason why the gateway refused the command, such as wrong code #}
              <table><tr><td>_("Contact")</td><td>{% if state_attr(c, 'event_type') %}<b>{{ m(state_attr(c, 'name') or state_attr(c, 'prefix') or '?') }}</b> {{ what(state_attr(c, 'event_type')) }} · {{ when(states(c)) }}{% else %}_("none yet"){% endif %}</td></tr><tr><td>_("Position and battery")</td><td>{% if state_attr(t, 'event_type') %}<b>{{ m(state_attr(t, 'name') or state_attr(t, 'prefix') or '?') }}</b> {% if state_attr(t, 'event_type') == 'answered' %}_("answers again"){% else %}_("stopped answering"){% endif %} · {{ when(states(t)) }}{% else %}_("none yet"){% endif %}</td></tr><tr><td>_("Radio settings")</td><td>{% if state_attr(s, 'event_type') %}{{ setting(state_attr(s, 'setting')) }}: {{ status(state_attr(s, 'event_type')) }} · {{ when(states(s)) }}{% else %}_("none yet"){% endif %}</td></tr><tr><td>_("New node")</td><td>{% if state_attr(n, 'event_type') %}<b>{{ m(state_attr(n, 'name') or (state_attr(n, 'key') or '')[:8] or '?') }}</b> _("heard for the first time") · {{ when(states(n)) }}{% else %}_("none yet"){% endif %}</td></tr>{% if states[k] is not none %}<tr><td>_("Command")</td><td>{% if refused %}_("{sender}: {word}, refused: {reason}") · {{ when(states(r)) }}{% elif state_attr(k, 'event_type') %}_("{sender}: {word}") · {{ when(states(k)) }}{% else %}_("none yet"){% endif %}</td></tr>{% endif %}</table>
              {%- endif %}
              <details><summary>_("What this shows")</summary><ul><li>_("The newest event of each kind, in full. Home Assistant keeps only the newest of each here.")</li><li>_("A refused command shows only until the next message arrives, of any kind.")</li><li>_("Help explains each word.") <a href="./help">_("Help")</a></li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What this view is for")</summary><p>_("For whoever looks after the gateway: each part with its state, the radio and its settings, and the newest events.")</p><p><a href="./help">_("Help")</a></p></details>
  - title: _("Settings")
    path: settings
    subview: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Settings")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set hidden = 'button.@gw@_show_hidden' -%}
              {%- set ns = namespace(chats=[]) -%}
              {%- for x in ["@chats@"] -%}{%- set ns.chats = ns.chats + [x.title] -%}{%- endfor -%}
              {%- set chats = m(ns.chats | join(', ')) -%}
              {%- if states[radio] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif is_state(radio, 'unavailable') -%}
              <div><ha-alert alert-type="error">_("The gateway is offline. Its settings show again when it is back.")</ha-alert></div>
              {%- elif states['sensor.@gw@_configuration'] is none -%}
              <div><ha-alert alert-type="warning">_("This gateway does not report its settings: that needs version 2.1 or later. Ask your administrator to update the gateway.")</ha-alert></div>
              {#- Translators: chats are the names of this dashboard's chats, separated by commas #}
              <div>{% if states[hidden] is not none and is_state(hidden, 'unavailable') %}_("Contact controls in Home Assistant: off.") {% elif states[hidden] is not none %}_("Contact controls in Home Assistant: on.") {% endif %}{% if chats %}_("Chats: {chats}."){% endif %}</div>
              {%- else -%}
              <div><ha-alert alert-type="info"><b>_("Set by your administrator.")</b> _("These come from the gateway's configuration file when it starts. Home Assistant cannot change them, on purpose.")</ha-alert></div>
              {%- endif %}
              <details><summary>_("Why can't I change this here?")</summary><p>_("A switch here would work for everyone who uses Home Assistant, children and guests included. Settings that protect people, the radio or the law stay with the administrator.")</p></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Chats and messages")
            # with its table, or the section shows a heading alone
            visibility:
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.@gw@_configuration', 'targets') is mapping
                     and state_attr('sensor.@gw@_configuration', 'messages') is mapping }}
          - type: markdown
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set c = 'sensor.@gw@_configuration' -%}
              {%- set targets = state_attr(c, 'targets') -%}{%- set s = state_attr(c, 'messages') -%}
              {%- if targets is mapping and s is mapping -%}
              {%- set ns = namespace(chats=[], affixes=[]) -%}
              {%- for t in (targets.get('items') or []) if t is mapping -%}
              {%- set ns.chats = ns.chats + [t] -%}
              {%- if t.get('prefix') or t.get('suffix') -%}{%- set ns.affixes = ns.affixes + [t] -%}{%- endif -%}
              {%- endfor -%}
              {%- set more = ((targets.get('total') | int(0)) - (ns.chats | count)) | int -%}
              {%- set ignored = (s.get('ignore_channels') or []) | count -%}
              {%- set dedup = s.get('dedup_window_s') if s.get('dedup_window_s') is number else 0 -%}
              {%- set window = (dedup // 60) | int -%}{%- set seconds = (dedup | round(0, 'ceil')) | int -%}
              {%- set size = s.get('queue_size') | int(0) -%}{%- set minutes = ((s.get('queue_ttl_s') or 0) / 60) | round(0, 'ceil') | int -%}{%- set tries = s.get('max_attempts') | int(0) -%}
              {#- a target by its title, as Chats names it (D-7), then its alias, a name of the configuration -#}
              {%- macro named(t) -%}{%- set words = (t.get('alias') or '') | string | regex_replace('[-_]', ' ') -%}<b>{{ m(words[:1] | upper ~ words[1:]) }}</b> <code>{{ m(t.get('alias')) }}</code>{%- endmacro -%}
              {#- Translators: a target of the configuration in the list of chats: n is its channel's number -#}
              {%- macro chat(t) -%}{{ named(t) }} {% if t.get('kind') == 'channel' %}{%- set n = t.get('channel_index') | int(0) -%}_("(channel {n})"){% else %}_("(person)"){% endif %}{% if t.get('alert') == true %} · _("sent first"){% endif %}{% if t.get('hidden') == true %} · _("only automations write here"){% endif %}{%- endmacro -%}
              {%- macro affix(t) -%}{{ named(t) }}: <code>{{ m(t.get('prefix')) }}</code> … <code>{{ m(t.get('suffix')) }}</code>{%- endmacro -%}
              {#- Translators: the settings of the chats; more, n, window, seconds, size, minutes and tries are whole numbers #}
              <table><tr><th>_("Setting")</th><th>_("In this home")</th><th>_("What it means")</th></tr><tr><td>_("Chats")</td><td>{%- for t in ns.chats -%}{{ chat(t) }}{% if not loop.last %}<br>{% endif %}{%- endfor -%}{% if more > 0 %}<br>_("and {more} more"){% endif %}</td><td>_("The chats of this home. Your administrator adds them.") <code>targets</code></td></tr><tr><td>_("Text before or after messages")</td><td>{%- for t in ns.affixes -%}{{ affix(t) }}{% if not loop.last %}<br>{% endif %}{%- else -%}_("none"){%- endfor -%}</td><td>_("Added to every message sent to that chat.") <code>prefix</code> <code>suffix</code></td></tr><tr><td>_("Channel messages shown")</td><td>{% if s.get('publish_channels') == 'all' %}_("all channels"){% else %}_("only the chats' channels"){% endif %}</td><td>_("Which channels of the radio show in Chats.") <code>[messages]</code> <code>publish_channels</code></td></tr><tr><td>_("Channels ignored")</td><td>{{ m(ignored | string) }}</td><td>_("Messages on these channels never show.") <code>[messages]</code> <code>ignore_channels</code></td></tr><tr><td>_("Delivery code")</td><td>{% if s.get('confirm_nonce') == true %}_("on"){% else %}_("off"){% endif %}</td><td>_("On: direct messages end in a short code such as #1a2b3c4d; it makes a faked confirmation harder. The chat hides it.") <code>[messages]</code> <code>confirm_nonce</code></td></tr><tr><td>_("Long messages")</td><td>{% if s.get('truncate') == false %}_("refused"){% else %}_("cut, ending in ..."){% endif %}</td><td>_("What happens to a text longer than a chat takes.") <code>[messages]</code> <code>truncate</code></td></tr><tr><td>_("Letters")</td><td>{% if s.get('ascii_only') == true %}_("without accents (ä becomes ae)"){% else %}_("as written"){% endif %}</td><td>_("How the letters of a message are sent.") <code>[messages]</code> <code>ascii_only</code></td></tr><tr><td>_("Same text again")</td><td>{% if dedup >= 120 and dedup % 60 == 0 %}_("not sent again within {window} minutes"){% elif dedup > 0 %}_("not sent again within {seconds} seconds"){% else %}_("sent again"){% endif %}</td><td>_("Stops a message sent twice by mistake.") <code>[messages]</code> <code>dedup_window_s</code></td></tr><tr><td>_("Waiting messages")</td><td>_("up to {size}, for {minutes} minutes, {tries} tries")</td><td>_("How many messages may wait, for how long, and how often a direct message is tried.") <code>[messages]</code> <code>queue_size</code> <code>queue_ttl_s</code> <code>max_attempts</code></td></tr></table>
              <details><summary>_("What these settings do")</summary><ul><li>_("Sent first: an alert goes out before the messages that wait.")</li><li>_("Only automations write here: the chat has no field on this dashboard.")</li><li>_("The words in code are the names in the gateway's configuration file, for your administrator.")</li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Privacy")
            # with its table, or the section shows a heading alone
            visibility:
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.@gw@_configuration', 'telemetry') is mapping
                     and state_attr('sensor.@gw@_configuration', 'contacts') is mapping
                     and state_attr('sensor.@gw@_configuration', 'history') is mapping
                     and state_attr('sensor.@gw@_configuration', 'messages') is mapping }}
          - type: markdown
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set c = 'sensor.@gw@_configuration' -%}
              {%- set t = state_attr(c, 'telemetry') -%}{%- set k = state_attr(c, 'contacts') -%}{%- set h = state_attr(c, 'history') -%}{%- set s = state_attr(c, 'messages') -%}
              {%- if t is mapping and k is mapping and h is mapping and s is mapping -%}
              {%- set messages = (h.get('messages_days') or 0) | round(0, 'ceil') | int -%}{%- set positions = (h.get('positions_days') or 0) | round(0, 'ceil') | int -%}{%- set readings = (h.get('readings_days') or 0) | round(0, 'ceil') | int -%}
              {#- Translators: the privacy settings; messages, positions and readings are whole numbers of days #}
              <table><tr><th>_("Setting")</th><th>_("In this home")</th><th>_("What it means")</th></tr><tr><td>_("Position and battery asked from")</td><td>{% if t.get('enabled') == false %}_("nobody: asking is off"){% elif t.get('ask') == 'all' %}_("every person not turned off"){% else %}_("only people turned on"){% endif %}{% if t.get('enabled') != false %}{%- set types = t.get('ask_types') or [] -%}<br>{% if 'sensor' in types and 'chat' in types %}_("persons and sensors"){% elif 'sensor' in types %}_("sensors"){% else %}_("persons"){% endif %}{% endif %}</td><td>_("Ask for position and battery on Contacts turns it on or off for each person.") <code>telemetry</code></td></tr><tr><td>_("Nodes heard nearby")</td><td>{% if k.get('heard_nodes') == 'off' %}_("not kept"){% elif k.get('heard_nodes') == 'full' %}_("keys and names"){% else %}_("keys only"){% endif %}</td><td>_("Other people's radios that this home hears.") <code>[contacts]</code> <code>heard_nodes</code></td></tr><tr><td>_("History kept by the gateway")</td><td>{% if h.get('enabled') == false %}_("off: chats show only messages since the gateway started"){% else %}_("messages {messages} days, positions {positions} days, readings {readings} days"){% endif %}</td><td>_("The gateway's own record, besides what Home Assistant records.") <code>history</code></td></tr><tr><td>_("Received texts cleaned")</td><td>{% if s.get('clean_received') == true %}_("on"){% else %}_("off"){% endif %}</td><td>_("On: control and direction characters are removed from received texts.") <code>[messages]</code> <code>clean_received</code></td></tr></table>
              <details><summary>_("Who sees what")</summary><ul><li>_("Everyone who uses Home Assistant here sees every chat, position, setting and unsent text, and can write to every chat.")</li><li>_("Help says what Home Assistant records.") <a href="./help">_("Help")</a></li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Contacts and Home Assistant")
            # with its table, or the section shows a heading alone
            visibility:
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.@gw@_configuration', 'homeassistant') is mapping
                     and state_attr('sensor.@gw@_configuration', 'contacts') is mapping }}
          - type: markdown
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set c = 'sensor.@gw@_configuration' -%}
              {%- set a = state_attr(c, 'homeassistant') -%}{%- set k = state_attr(c, 'contacts') -%}
              {%- if a is mapping and k is mapping -%}
              {%- set devices = a.get('contact_devices') | int(0) -%}
              {#- Translators: the settings of the contacts in Home Assistant; devices is a whole number #}
              <table><tr><th>_("Setting")</th><th>_("In this home")</th><th>_("What it means")</th></tr><tr><td>_("Contact controls in Home Assistant")</td><td>{% if a.get('controls') == false %}_("off: your administrator manages contacts outside Home Assistant"){% else %}_("on"){% endif %}</td><td>_("The switches and buttons on Contacts.") <code>[homeassistant]</code> <code>controls</code></td></tr><tr><td>_("Contacts managed by the gateway")</td><td>{% if k.get('manage') == false %}_("off"){% else %}_("on"){% endif %}</td><td>_("On: the gateway adds and removes contacts on request.") <code>[contacts]</code> <code>manage</code></td></tr><tr><td>_("Contacts with a device")</td><td>_("up to {devices}")</td><td>_("Each has its own entities in Home Assistant.") <code>[homeassistant]</code> <code>contact_devices</code></td></tr><tr><td>_("Contact entity IDs start with")</td><td><code>{{ m(a.get('contact_entity_prefix')) }}</code></td><td>_("The start of every contact's entity IDs.") <code>[homeassistant]</code> <code>contact_entity_prefix</code></td></tr><tr><td>_("Language of names")</td><td><code>{{ m(a.get('language')) }}</code></td><td>_("The language of the entities' names and of this dashboard.") <code>[homeassistant]</code> <code>language</code></td></tr></table>
              <details><summary>_("What these settings do")</summary><ul><li>_("A contact prefix of its own keeps two gateways' contacts apart in Home Assistant.")</li><li>_("The words in code are the names in the gateway's configuration file, for your administrator.")</li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Radio and airtime")
            # with its table, or the section shows a heading alone
            visibility:
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.@gw@_configuration', 'radio') is mapping
                     and state_attr('sensor.@gw@_configuration', 'airtime') is mapping
                     and state_attr('sensor.@gw@_configuration', 'commands') is mapping }}
          - type: markdown
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- set c = 'sensor.@gw@_configuration' -%}
              {%- set r = state_attr(c, 'radio') -%}{%- set air = state_attr(c, 'airtime') -%}{%- set k = state_attr(c, 'commands') -%}
              {%- if r is mapping and air is mapping and k is mapping -%}
              {%- set manage = (r.get('profile') or {}).get('manage') if (r.get('profile') or {}) is mapping else none -%}
              {%- set budget = num(air.get('budget_s_per_hour')) -%}{%- set burst = num(air.get('burst_s')) -%}{%- set senders = k.get('senders') | int(0) -%}
              {#- Translators: the settings of the radio; budget and burst are seconds, such as 36 and 2.5, written with this language's decimal mark #}
              <table><tr><th>_("Setting")</th><th>_("In this home")</th><th>_("What it means")</th></tr><tr><td>_("Connected by")</td><td>{% if r.get('transport') == 'tcp' %}_("network"){% else %}_("USB"){% endif %}</td><td>_("How the gateway reaches its radio.") <code>[radio]</code> <code>transport</code></td></tr><tr><td>_("Radio settings managed")</td><td>{% if manage == 'observe' %}_("only watched"){% elif manage == 'always' %}_("managed on any firmware"){% elif manage == 'auto' %}_("managed on tested firmware, only watched on other firmware"){% else %}<code>{{ m(manage) }}</code>{% endif %}</td><td>_("Whether the gateway keeps the radio's settings as this home needs them.") <code>[radio.profile]</code> <code>manage</code></td></tr><tr><td>_("Clock set by the gateway")</td><td>{% if r.get('set_clock') == false %}_("off"){% else %}_("on"){% endif %}</td><td>_("The gateway sets the radio's clock from the computer's.") <code>[radio]</code> <code>set_clock</code></td></tr><tr><td>_("Airtime budget")</td><td>_("{budget} s an hour, bursts of {burst} s")</td><td>_("The law allows a radio only a share of each hour; messages wait when it is used up.") <code>airtime</code></td></tr><tr><td>_("Command senders")</td><td>{{ m(senders | string) }}</td><td>_("Contacts that may send commands to this home's automations.") <code>[commands]</code> <code>senders</code></td></tr><tr><td>_("Command codes")</td><td>{% if k.get('codes') == true %}_("on"){% else %}_("off"){% endif %}</td><td>_("On: the senders your administrator gave a code secret end each command with a code that changes every 30 seconds. While the gateway ignores a secret in the file, the other senders cannot command.") <code>[commands]</code> <code>codes_file</code></td></tr></table>
              {%- if r.get('transport') == 'tcp' and r.get('tcp_unauthenticated') == true %}
              {#- Translators: security text (docs/translations.md): the radio's network link has no password, so whoever reaches its port controls the radio and can read its key #}
              <div><ha-alert alert-type="warning">_("The radio's network link has no password: anyone who reaches its port can control the radio. Your administrator knows how to close it.")</ha-alert></div>
              {%- endif %}
              <details><summary>_("What these settings do")</summary><ul><li>_("Radio settings managed: the gateway keeps the radio's settings as this home needs them, or only watches them.")</li><li>_("The words in code are the names in the gateway's configuration file, for your administrator.")</li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Versions")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {#- offline, Home Assistant drops the attributes: the gateway's versions would read as unknown -#}
              {%- if is_state(radio, 'unavailable') -%}
              <div>_("The gateway is offline: this shows again when it is back.")</div>
              <table><tr><td>_("This dashboard")</td><td>@version@</td></tr></table>
              {%- else -%}
              {#- Translators: the versions of this dashboard, of the gateway and of the radio -#}
              <table><tr><td>_("This dashboard")</td><td>@version@</td></tr><tr><td>_("Gateway")</td><td>{{ m(state_attr(radio, 'bridge_version') or '–') }}</td></tr><tr><td>_("Radio firmware")</td><td>{{ m(state_attr(radio, 'firmware') or '–') }}</td></tr><tr><td>_("Radio model")</td><td>{{ m(state_attr(radio, 'model') or '–') }}</td></tr></table>
              {%- endif %}
              <details><summary>_("Why versions matter")</summary><ul><li>_("When the dashboard and the gateway differ in the first two numbers, Overview says which one to update.")</li><li>_("Tell your administrator these versions when you report a problem.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What this view is for")</summary><p>_("What your administrator set for this home: chats and messages, privacy, contacts, the radio and the versions. Read only.")</p><p><a href="./help">_("Help")</a></p></details>
  - title: _("Help")
    path: help
    subview: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Help")
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What this gateway does")</summary><ul><li>_("It links this home's radio to Home Assistant: messages, contacts, and the position and battery of people who agreed.")</li><li>_("It needs no internet: radios reach each other directly or through repeaters.")</li><li>_("Channels are not private: everyone with a channel's key reads it, also outside this home.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("The views")</summary><ul><li><a href="./overview"><b>_("Overview")</b></a>: _("Whether everything is fine, what needs a look, the latest chats and where everyone is.")</li><li><a href="./messages"><b>_("Chats")</b></a>: _("Every chat, and all messages together. Tap a chat to open its page.")</li><li><b>_("A chat's page")</b>: _("One chat as a messenger shows it, with the field to write at the bottom.")</li><li><a href="./contacts"><b>_("Contacts")</b></a>: _("People and devices on this home's radio: who is asked for position and battery, how to add or remove someone, and which nodes are nearby.")</li><li><a href="./map"><b>_("Map")</b></a>: _("Where the household's devices were in the last 24 hours.")</li><li><a href="./gateway"><b>_("Gateway")</b></a>: _("For whoever looks after the gateway: each part with its state, the radio and its settings, and the newest events.")</li><li><a href="./settings"><b>_("Settings")</b></a>: _("What your administrator set for this home: chats and messages, privacy, contacts, the radio and the versions. Read only.")</li><li><b>_("Help")</b>: _("This page: what spans the whole dashboard. Each card has its own help in its fold.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              {#- Translators: Write to … is the label of a chat's message field without the chat's name: write it as you translated Write to {name}; Return (↵) is the keyboard's key, the same word as in the name beside the Send button (Return, then Send) #}
              <details><summary>_("Every button and switch")</summary><ul><li><b>_("Write to …")</b>, <b>_("Return, then Send")</b>: _("At the bottom of a chat's page: type, tap Return (↵), then tap Send. Return only keeps the text at the gateway; Send sends it, once.")</li><li><b>_("Ask for position and battery")</b>: _("On Contacts, a switch per person: on, the gateway asks that person's device now and then for its position and battery. Only for people who agreed.")</li><li><b>_("Add at once: pick a node heard nearby")</b>: _("On Contacts: adds the node you pick to the radio at once.")</li><li><b>_("Add by key or contact link")</b>: _("On Contacts: paste a key or a contact link from the MeshCore app, then tap Return (↵).")</li><li><b>_("Remove")</b>: _("On Contacts: takes a contact off the radio. It asks first.")</li><li><b>_("Hidden contacts")</b>, <b>_("Show again")</b>: _("On Contacts: brings back every contact whose device was deleted in Home Assistant.")</li><li><b>_("Background noise")</b>, <b>_("Radio battery")</b>: _("On Gateway: tap one for its history.")</li><li><b>_("Gateway's messages, last hour")</b>, <b>_("Everything the radio sent, last hour")</b>: _("On Gateway: the radio's airtime over the last 24 hours.")</li><li>_("The links, and the badges Gateway, Settings and Help, open a page of this dashboard; the back arrow returns to where you came from.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("Kinds of messages")</summary><ul><li>_("A person's chat is direct: only that person's device can read it.")</li><li>_("A channel is shared by everyone who has its key, also outside this home; a name shown on a channel is what the sender typed: anyone can type any name.")</li><li>_("A chat marked only automations write here has no field: your administrator keeps it for automations.")</li><li>_("Commands: a few contacts your administrator chose may send words that start this home's automations.")</li><li>_("This dashboard writes by draft and send: the field keeps your text at the gateway, and Send sends it, once.")</li><li>_("Automations send in their own way, which your administrator sets up; they can also wait for the answer.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What this dashboard cannot do")</summary><ul><li>_("It shows no unread marks per person: everyone in this home sees the same chats.")</li><li>_("It shows no typing indicator.")</li><li>_("✓✓ is the confirmation of the person's radio, not that the person read the message.")</li><li>_("It does not know who in this home sent a message: a message sent from here is from this home.")</li><li>_("The field of a chat is shared by everyone in this home.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("When something is wrong")</summary><ul><li>_("The first line of Overview names the problem; the card below it says what to do. Tell your administrator the time and what the card says.")</li><li><b>_("a fault in the gateway")</b>: _("A part of the gateway does not work as it should. Messages still go out.")</li><li><b>_("a node imitates a contact")</b>: _("A radio nearby has a key that starts like a contact's.")</li><li><b>_("remote access to the radio")</b>: _("A contact may change this home's radio over the air.")</li><li><b>_("a position broadcast to everyone")</b>: _("A person's device tells everyone in range where it is.") _("Until the gateway has read the device's newest advert, it goes by the position this home's radio still remembers for it.")</li><li><b>_("the radio's settings")</b>: _("The radio's settings could not be set, or someone changed them.")</li><li><b>_("asking for position and battery is paused")</b>: _("The gateway asks nobody for now; the card says why.")</li><li><b>_("the radio's clock")</b>: _("The radio's clock is far off.")</li><li><b>_("the contact table is full")</b>: _("The radio cannot add a new contact.")</li><li><b>_("the dashboard and the gateway are of different versions")</b>: _("Some cards may be missing or empty until your administrator updates one of them.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("Why a message was not sent")</summary><ul><li><b>_("no acknowledgement")</b>: _("The person's radio did not confirm it: out of range, switched off, or the way through the mesh changed.")</li><li><b>_("not a contact on the radio")</b>, <b>_("not a companion")</b>: _("The radio cannot send to this person now; your administrator checks the contact.")</li><li><b>_("no such target")</b>, <b>_("channel not set up on the radio")</b>: _("The chat does not exist on the gateway or on the radio; your administrator checks the configuration.")</li><li><b>_("another contact has the same key prefix")</b>: _("Two contacts start alike, so the radio cannot tell them apart; your administrator removes one.")</li><li><b>_("text too long")</b>, <b>_("request too large")</b>: _("Write a shorter text.")</li><li><b>_("text not UTF-8")</b>, <b>_("published with the retain flag")</b>: _("An automation sent it in a wrong form; your administrator fixes it.")</li><li><b>_("empty text")</b>: _("There was nothing to send.")</li><li><b>_("queue full")</b>, <b>_("waited too long")</b>, <b>_("airtime used up")</b>, <b>_("needs more airtime than one burst")</b>: _("The radio may send only so much per hour, and many messages were waiting. Send it again later, or shorter.")</li><li><b>_("no radio")</b>: _("The gateway had no connection to its radio.")</li><li><b>_("the gateway was stopping")</b>: _("The gateway was shutting down or restarting. Send it again once it is back.")</li><li><b>_("internal error: see the log")</b>: _("The gateway hit an error; tell your administrator the time.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("Asking for position and battery: the words")</summary><ul><li><b>_("not asked yet")</b>: _("The gateway has not asked yet, or not for over a day.")</li><li><b>_("answering")</b>: _("The answers are current and carry a position.")</li><li><b>_("answering, no position")</b>: _("The answers are current, without a position: GPS off, no fix, or location not allowed in the app.")</li><li><b>_("no answer lately")</b>: _("It answered today, not lately: out of range or switched off.")</li><li><b>_("no answer for a day")</b>: _("Asked, but no answer for a day: it does not allow this home, does not have it as a contact, or is out of range.")</li><li><b>_("not reachable now")</b>: _("Not asked: the radio has no way to it now. A message or an advert from it brings it back.")</li><li><b>_("not asked: look-alike")</b>: _("Another node's key starts the same, so an answer could not be told apart.")</li><li><b>_("not asked (switch off)")</b>: _("The switch is off for this person.")</li><li><b>_("off for everyone")</b>: _("Your administrator turned asking off in this home's settings.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What happened to a contact")</summary><ul><li><b>_("added to the radio")</b>, <b>_("removed from the radio")</b>: _("The radio's contact list changed: by a request here, in the MeshCore app, or by the radio itself.")</li><li><b>_("hidden: its device was deleted in Home Assistant")</b>, <b>_("shown again")</b>: _("Someone deleted the contact's device in Home Assistant, or tapped Show again.")</li><li><b>_("request refused")</b>, <b>_("request failed")</b>: _("Adding or removing did not work; the reason in brackets says why.")</li><li><b>_("no longer asked for position and battery")</b>, <b>_("asked for position and battery")</b>: _("Someone turned Ask for position and battery off or on for this person.")</li><li><b>_("broadcasts its position to everyone in range")</b>: _("That person's device tells everyone nearby where it is; Overview says what to do.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("Why adding or removing did not work")</summary><ul><li><b>_("no key, link or contact card")</b>, <b>_("a link of another kind")</b>: _("The field held no key or contact link this gateway reads. Copy it again from the MeshCore app (Share contact).")</li><li><b>_("invalid request")</b>, <b>_("request too large")</b>, <b>_("request not UTF-8")</b>, <b>_("published with the retain flag")</b>: _("An automation sent the request in a wrong form; your administrator fixes it.")</li><li><b>_("unsupported node type")</b>: _("This kind of node cannot be added.")</li><li><b>_("no heard node or contact of that name")</b>: _("The node is no longer among the nodes heard nearby. Pick it again once it is heard.")</li><li><b>_("not a contact on the radio")</b>: _("The contact is gone from the radio already.")</li><li><b>_("contact management is off")</b>, <b>_("firmware not tested")</b>, <b>_("no radio")</b>: _("Adding and removing do not work now; the line above the controls on Contacts says why.")</li><li><b>_("the gateway's own key")</b>: _("That is this home's own radio.")</li><li><b>_("a target or command sender")</b>: _("Your administrator keeps this contact on the radio on purpose.")</li><li><b>_("too many requests waiting")</b>, <b>_("too many requests")</b>: _("Too many requests came at once. Try again in a minute.")</li><li><b>_("already a contact")</b>: _("It is on the radio already.")</li><li><b>_("another contact has the same key prefix")</b>: _("Another contact's key starts the same, so the radio could not tell them apart. Compare the whole key with the node's own screen.")</li><li><b>_("contact table full")</b>: _("The radio's contact list is full. Remove contacts you no longer need.")</li><li><b>_("the radio's table does not show it")</b>, <b>_("outcome unknown: the next table read tells")</b>: _("The radio did not confirm the change. Look at the contacts again in a minute.")</li><li><b>_("never asked for position and battery")</b>: _("Only a person's device is asked for its position and battery.")</li><li><b>_("too many keys stored")</b>, <b>_("in effect, not stored yet")</b>, <b>_("in effect, history not deleted")</b>, <b>_("cannot be stored")</b>: _("The change works now, but the gateway could not store it. Tell your administrator.")</li><li><b>_("internal error: see the log")</b>: _("The gateway hit an error; tell your administrator the time.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              {#- Translators: security text (docs/translations.md): a command needs the sender's current code; a sender without a code secret is refused while the gateway ignores a secret of a key that is no sender; wrong codes may be someone guessing them, and after 5 within an hour the sender is refused #}
              <details><summary>_("Why a command was refused")</summary><ul><li>_("A command the gateway refused shows with its reason after the word refused, but only until the next message arrives. The gateway's log also names a sender refused for too many wrong codes.")</li><li><b>_("sender not a contact")</b>, <b>_("sender not allowed")</b>, <b>_("another contact has the same key prefix")</b>: _("Only the contacts your administrator chose may send commands, and only while no other node's key starts the same.")</li><li><b>_("sender not checked yet")</b>: _("The gateway could not check the sender at that moment, such as while it connected to the radio. The sender can send the command again.")</li><li><b>_("an old command again")</b>, <b>_("too old")</b>, <b>_("dated in the future")</b>: _("A copy of an earlier command, or a clock that is off: the sender's or the computer's. A command sent anew works; if it happens again, your administrator checks the clocks.")</li><li><b>_("no code")</b>: _("A sender with a code secret ends each command with the 6-digit code of its authenticator app; this command had none. A sender without a code secret is refused this way too while the gateway ignores a secret in the codes file: tell your administrator, who gives the sender a secret or removes the ignored one.")</li><li><b>_("wrong code")</b>, <b>_("code used already")</b>: _("A command of this sender ends in the 6-digit code of an authenticator app, new every 30 seconds and good once. Check the clock of the sender's phone.")</li><li><b>_("too many wrong codes")</b>: _("5 wrong codes within an hour: the gateway refuses that sender's commands until the first of them is an hour old. Someone may be guessing the codes; tell your administrator.")</li><li><b>_("cannot be stored")</b>, <b>_("broker unreachable")</b>: _("The gateway could not keep the command safe from copies, or could not pass it on to the automations. The sender can send the command again; tell your administrator if it repeats.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("The radio's settings: the words")</summary><ul><li><b>_("as wanted")</b>: _("The radio has the setting this home needs.")</li><li><b>_("written")</b>: _("The gateway set it at the last connect.")</li><li><b>_("changed by someone")</b>, <b>_("changed on the radio")</b>: _("Someone changed it on the radio, for example in the MeshCore app.")</li><li><b>_("differs: only watched")</b>: _("It differs from what this home wants, and the gateway only watches this radio.")</li><li><b>_("could not be set")</b>, <b>_("refused by the radio")</b>, <b>_("not taken by the radio")</b>, <b>_("given up")</b>: _("The radio did not take the setting; tell your administrator.")</li><li><b>_("not supported")</b>, <b>_("turned off in the firmware")</b>: _("The radio's firmware cannot do it.")</li><li><b>_("left as found")</b>, <b>_("not reported")</b>: _("The gateway does not keep this setting, or the radio does not report it.")</li><li><b>_("no value yet")</b>: _("The gateway has not reported it since Home Assistant started.")</li><li><b>_("never")</b>, <b>_("contacts you allowed")</b>, <b>_("every contact")</b>: _("Who may ask this home's radio for its battery, position or readings: nobody, the contacts allowed in the MeshCore app, or every contact on the radio.")</li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("Who sees what")</summary><ul><li>_("Everyone who uses Home Assistant here sees every chat, position, setting and unsent text, and can write to every chat.")</li><li>_("Home Assistant keeps a history of what it shows: also every text left in a chat's field, even one deleted before sending, unless your administrator turned that off.")</li><li><a href="@guide@#privacy">_("More in the guide")</a></li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              {#- Translators: the menus and words of Home Assistant as its own translation names them #}
              <details><summary>_("For your administrator")</summary><ul><li>_("For your administrator: make this dashboard again after an update of the gateway to another major or minor version, after adding a target, and after contacts got a device: each needs its chat page and its controls.")</li><li>_("For your administrator: Home Assistant records every message text, also the drafts, unless its recorder leaves them out.") <a href="@guide@#privacy">_("How, in the guide")</a></li><li>_("For your administrator: a second gateway needs its own dashboard and a contact prefix of its own.") <a href="@guide@#a-second-gateway">_("How, in the guide")</a></li><li>_("For your administrator: the links to the guide go to the guide of this version.")</li><li>_("For your administrator: this dashboard needs Home Assistant 2026.10 or later.")</li></ul></details>
# @each chats
  - title: "@chats.title@"
    path: "@chats.path@"
    subview: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
# @if chats.write
          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set key = '@chats.key@' -%}{%- set chan = @chats.channel@ -%}
              {%- set ns = namespace(device=none, heard=none) -%}
              {%- for d in ([] if gw is none or key == '' else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) if device_attr(d, 'serial_number') == key -%}{%- set ns.device = d -%}{%- endfor -%}
              {%- for e in (device_entities(ns.device) if ns.device is not none else []) | select('match', 'sensor\\.\\w+_last_heard(_\\d+)?$') -%}{%- set ns.heard = e -%}{%- endfor -%}
              {%- set heard = when(states(ns.heard) if ns.heard is not none else '') -%}
              {%- set fresh = ns.heard is not none and states(ns.heard) not in ['unknown', 'unavailable'] -%}
              {%- set gone = '@chats.path@'.startswith('contact-') and gw is not none and ns.device is none -%}
              {%- set cfg = state_attr('sensor.@gw@_configuration', 'targets') -%}
              {%- set messages = state_attr('sensor.@gw@_configuration', 'messages') -%}
              {%- set t = namespace(found=none) -%}
              {%- for x in ((cfg.get('items') or []) if cfg is mapping else []) if x is mapping and x.get('alias') == '@chats.target@' -%}{%- set t.found = x -%}{%- endfor -%}
              {%- set room = (t.found.get('room') if t.found is not none and t.found.get('room') is number else @chats.room@) | int -%}
              {%- set cut = not (messages is mapping and messages.get('truncate') == false) -%}
              {#- the window of the same text from G6: 0 is off; in minutes when it is whole minutes, else in seconds; a few minutes without G6 -#}
              {%- set dedup = messages.get('dedup_window_s') if messages is mapping and messages.get('dedup_window_s') is number else -1 -%}
              {%- set window = (dedup // 60) | int -%}{%- set seconds = (dedup | round(0, 'ceil')) | int -%}
              {%- set minutes = 15 | int -%}
              {#- the field of a person's own device went with the device; a contact target's stays -#}
              {%- set own = '@chats.target@' == '' -%}
              {#- Translators: heard is a time, such as 10:31 or yesterday 10:31 -#}
              <div><b>{{ m('@chats.title@') }}</b>{% if chan >= 0 %} · _("channel · everyone with the channel's key reads it"){% elif fresh %} · _("heard {heard}"){% endif %}</div>
              {%- if gone %}
              {#- Translators: name is a person's name; hidden: someone deleted the contact's device in Home Assistant, which hides the contact #}
              <div><ha-alert alert-type="warning"><b>_("{name} is no longer a contact of this radio, or was hidden.")</b> {% if own %}_("The messages stay readable here until they leave the window; writing is not possible."){% else %}_("If the radio no longer has the contact, messages to {name} are not delivered."){% endif %}</ha-alert></div>
              {%- endif %}
              {#- Translators: the help on writing. Return (↵) is the keyboard's key: the word the phone keyboards of your language show, with the sign ↵, and the same word as in the name beside the Send button (Return, then Send); Send and Write to {name} as their labels are translated. name is the chat's title; minutes, room, window and seconds are whole numbers #}
              <details><summary>{% if gone and own %}_("Why you cannot write here"){% else %}_("How to write"){% endif %}</summary><ul>{% if gone and own %}<li>_("The radio no longer has {name} as a contact, or someone hid the contact by deleting its device in Home Assistant. This page's field went with the device.")</li><li>_("To write again, add the contact again, or show hidden contacts again (Contacts).")</li>{% else %}<li>_("Type in the field “Write to {name}” at the bottom, tap Return (↵), then tap Send. Return only keeps the text; Send sends it.")</li><li>_("Wait until the field is empty before you write the next message. It empties when the gateway has taken yours, and your message shows in the chat.")</li><li>_("Everyone in this home who uses Home Assistant shares this field. What someone else leaves in it is what Send sends, and their text can replace yours while you type. Read the field before you tap Send.")</li><li>_("If the connection drops, the field can show an older text again. Read it before you tap Send.")</li><li>_("A text left in the field is cleared after {minutes} minutes. Reloading the page or a Home Assistant restart loses only what you were still typing. A restart of the gateway empties the field. The messages in the chat show what was really sent.")</li><li>{% if cut %}_("About {room} letters; a longer text is cut and ends in ...; letters with accents and emoji count double or more."){% else %}_("About {room} letters; a longer text is not sent and stays in the field; letters with accents and emoji count double or more."){% endif %}</li>{% if dedup >= 120 and dedup % 60 == 0 %}<li>_("The same text to the same chat within {window} minutes is not sent again, unless it was not delivered.")</li>{% elif dedup > 0 %}<li>_("The same text to the same chat within {seconds} seconds is not sent again, unless it was not delivered.")</li>{% elif dedup < 0 %}<li>_("The same text to the same chat within a few minutes is not sent again, unless it was not delivered.")</li>{% endif %}<li>_("A text that is only the word unknown or unavailable cannot be written here.")</li><li>_("What you leave in the field is kept in Home Assistant's history, also if you delete it before sending, unless your administrator turned that off.")</li>{% endif %}</ul></details>
          # the refused line above the thread: the frontend caps the footer at a quarter of the
          # screen, and on top of the field it pushed Send below a phone's screen (H-27); under
          # the thread, the footer, which sticks to the screen's bottom, covered it (#143)
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- the reasons of mqtt-api.md, Delivery; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'no_acknowledgement' -%}_("no acknowledgement")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'unknown_target' -%}_("no such target")
              {%- elif v == 'ambiguous_target' -%}_("another contact has the same key prefix")
              {%- elif v == 'not_a_companion' -%}_("not a companion")
              {%- elif v == 'channel_not_configured' -%}_("channel not set up on the radio")
              {%- elif v == 'too_long' -%}_("text too long")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("text not UTF-8")
              {%- elif v == 'empty' -%}_("empty text")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'queue_full' -%}_("queue full")
              {%- elif v == 'stopping' -%}_("the gateway was stopping")
              {%- elif v == 'queue_ttl' -%}_("waited too long")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'airtime_budget' -%}_("airtime used up")
              {%- elif v == 'exceeds_airtime_burst' -%}_("needs more airtime than one burst")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'event.@gw@_delivery' -%}
              {%- set step = state_attr(e, 'event_type') -%}{%- set code = state_attr(e, 'reason') -%}
              {%- set at = states(e) | as_datetime(default=none) -%}
              {#- now(): the line goes 10 minutes after the refusal, also when nothing else changes -#}
              {%- set clock = now() -%}
              {%- set chan = @chats.channel@ -%}{%- set key = '@chats.key@' -%}
              {#- a refusal of this chat: its target is an alias of the chat's, or the person's key (D-15) -#}
              {%- set ours = ('@chats.aliases@'.split(',') if '@chats.aliases@' else []) + ([key] if key else []) -%}
              {%- set ns = namespace(later=false) -%}
              {#- a message of this chat accepted after the refusal ends its line -#}
              {%- for f in (state_attr('sensor.@gw@_message_history', 'messages') or []) + (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if f is mapping and ((f.get('kind') == 'channel' and f.get('channel_index') == chan) if chan >= 0 else (f.get('kind') == 'contact' and f.get('contact_key') == key)) -%}
              {%- set q = (f.get('queued_at') or '') | as_datetime(default=none) -%}
              {%- if q is not none and at is not none and q > at -%}{%- set ns.later = true -%}{%- endif -%}
              {%- endfor -%}
              {%- if step in ['rejected', 'duplicate'] and state_attr(e, 'target') in ours and at is not none and clock - at < timedelta(minutes=10) and not ns.later -%}
              {%- set reason = why(code) -%}
              {#- Translators: reason says why the gateway refused the message, such as text too long. Return (↵) is the keyboard's key: the same word as in the page's help on writing and in the name beside the Send button (Return, then Send); Send as the button's label is translated -#}
              <div><ha-alert alert-type="warning"><b>{% if step == 'duplicate' %}_("Not sent again: the same text went to this chat a moment ago."){% elif code == 'empty' %}_("Nothing was sent: the gateway had no text. Tap Return (↵) in the field (on a phone this also closes the keyboard), then Send."){% else %}_("Not sent: {reason}."){% endif %}</b></ha-alert></div>
              {%- endif -%}
# @else
          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set key = '@chats.key@' -%}{%- set chan = @chats.channel@ -%}
              {%- set ns = namespace(device=none, heard=none) -%}
              {%- for d in ([] if gw is none or key == '' else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) if device_attr(d, 'serial_number') == key -%}{%- set ns.device = d -%}{%- endfor -%}
              {%- for e in (device_entities(ns.device) if ns.device is not none else []) | select('match', 'sensor\\.\\w+_last_heard(_\\d+)?$') -%}{%- set ns.heard = e -%}{%- endfor -%}
              {%- set heard = when(states(ns.heard) if ns.heard is not none else '') -%}
              {%- set fresh = ns.heard is not none and states(ns.heard) not in ['unknown', 'unavailable'] -%}
              {%- set gone = '@chats.path@'.startswith('contact-') and gw is not none and ns.device is none -%}
              {#- Translators: heard is a time, such as 10:31 or yesterday 10:31 -#}
              <div><b>{{ m('@chats.title@') }}</b>{% if chan >= 0 %} · {% if '@chats.pair@' %}_("channel · everyone with the channel's key reads it"){% else %}_("channel · only automations write here"){% endif %}{% elif fresh %} · _("heard {heard}"){% endif %}</div>
              {%- if gone %}
              {#- Translators: name is a person's name; hidden: someone deleted the contact's device in Home Assistant, which hides the contact #}
              <div><ha-alert alert-type="warning"><b>_("{name} is no longer a contact of this radio, or was hidden.")</b> _("The messages stay readable here until they leave the window; writing is not possible.")</ha-alert></div>
              {%- endif %}
              {#- Translators: security text (docs/translations.md): who can read a chat, and that a name on a channel proves nothing #}
              <details><summary>_("Who reads this chat")</summary><ul><li>{% if chan >= 0 %}_("A channel is shared by everyone who has its key, also outside this home; a name shown on a channel is what the sender typed: anyone can type any name."){% else %}_("A person's chat is direct: only that person's device can read it."){% endif %}</li><li>_("Everyone in this home who uses Home Assistant reads this chat. Only automations write to it, unless the line below says why there is no field.")</li></ul></details>
# @end
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mt(x) -%}{%- set brk = '\u200b' -%}{{ m(x) | regex_replace('((?:&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f][\u0300-\u036f\u0483-\u0489]*){20})(?=&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f])', '\\1' ~ brk) }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro mark(v) -%}
              {#- Translators: how far a message sent from this home came, after its time -#}
              {%- if v == 'sent' -%}_("✓ sent")
              {%- elif v == 'confirmed' -%}_("✓✓ delivered")
              {#- Translators: security text (docs/translations.md): the confirmation came sooner than the message's way through the mesh allows -#}
              {%- elif v == 'suspect' -%}_("⚠ delivered? maybe forged")
              {%- elif v == 'failed' -%}_("✗ not delivered")
              {%- elif v == 'expired' -%}_("✗ not sent: waited too long")
              {%- elif v == 'queued' -%}_("… waiting to send")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- the reasons of mqtt-api.md, Delivery; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'no_acknowledgement' -%}_("no acknowledgement")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'unknown_target' -%}_("no such target")
              {%- elif v == 'ambiguous_target' -%}_("another contact has the same key prefix")
              {%- elif v == 'not_a_companion' -%}_("not a companion")
              {%- elif v == 'channel_not_configured' -%}_("channel not set up on the radio")
              {%- elif v == 'too_long' -%}_("text too long")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("text not UTF-8")
              {%- elif v == 'empty' -%}_("empty text")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'queue_full' -%}_("queue full")
              {%- elif v == 'stopping' -%}_("the gateway was stopping")
              {%- elif v == 'queue_ttl' -%}_("waited too long")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'airtime_budget' -%}_("airtime used up")
              {%- elif v == 'exceeds_airtime_burst' -%}_("needs more airtime than one burst")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {#- the gateway publishes confirm_nonce's code of a direct message sent from this home only in the final delivery event and the history (#87): cut while the setting is on now; the history carries no flag, so a message sent before a change of it shows the other way until it leaves the history; a gateway that does not say, being offline, as before (PC 16) -#}
              {%- set nonce = state_attr('sensor.@gw@_configuration', 'messages') -%}{%- set nonce = not (nonce is mapping and nonce.get('confirm_nonce') == false) -%}
              {%- macro row(e) -%}
              {%- set raw = (e.get('text') or '') | string -%}
              {%- set raw = raw | regex_replace(' #[0-9a-f]{8}$', '') if nonce and e.get('direction') == 'out' and e.get('kind') == 'contact' else raw -%}
              {%- set trouble = e.get('direction') != 'in' and (e.get('state') in ['failed', 'expired'] or e.get('suspect') == true) -%}
              {%- set state = 'suspect' if e.get('state') == 'confirmed' and e.get('suspect') == true else (e.get('state') or e.get('step') or '') -%}
              {%- set attempt = e.get('attempt') | int(0) -%}{%- set attempts = e.get('max_attempts') | int(0) -%}{%- set later = when(e.get('at')) -%}
              {%- if e.get('direction') == 'in' -%}<table role="presentation" width="100%"><tr><td width="85%" align="left"><small>{% if e.get('kind') == 'channel' %}<b>{{ m(e.get('name') or '?') }}</b> · {% endif %}{{ when(e.get('at')) }}</small><br>{{ mt(raw) }}</td><td width="15%"></td></tr></table>
              {%- else -%}
              {#- Translators: on its way: attempt and attempts are whole numbers; ✓✓ {later}: delivered, later the time the person's radio confirmed it, such as 10:34 -#}
              <table role="presentation" width="100%"><tr><td width="15%"></td><td width="85%" align="right">{% if trouble %}<ha-alert alert-type="warning">{% endif %}<small>{{ when(e.get('queued_at') or e.get('at')) }} · {% if state == 'sent' and e.get('step') %}_("… sent, waiting for confirmation (try {attempt} of {attempts})"){% elif state == 'confirmed' and e.get('queued_at') and when(e.get('queued_at')) != later %}_("✓✓ {later}"){% else %}{{ mark(state) }}{% endif %}{% if trouble and e.get('reason') and not (state == 'expired' and e.get('reason') == 'queue_ttl') %} ({{ why(e.get('reason')) }}){% endif %}</small><br>{% if e.get('step') %}<i>{{ mt(raw) }}</i>{% else %}{{ mt(raw) }}{% endif %}{% if trouble %}</ha-alert>{% endif %}</td></tr></table>
              {%- endif -%}
              {%- endmacro -%}
              {%- set h = 'sensor.@gw@_message_history' -%}
              {%- set all = state_attr(h, 'messages') -%}
              {%- set chan = @chats.channel@ -%}{%- set key = '@chats.key@' -%}
              {%- set ns = namespace(rows=[], ids=[], open=0, chars=0, stop=false, trouble=0) -%}
              {#- this chat's messages: a channel's by its index, whatever alias they went through; a person's by the key (D-15) -#}
              {%- for e in (all or []) if e is mapping -%}
              {%- if e.get('id') -%}{%- set ns.ids = ns.ids + [e.get('id')] -%}{%- endif -%}
              {%- if ((e.get('kind') == 'channel' and e.get('channel_index') == chan) if chan >= 0 else (e.get('kind') == 'contact' and e.get('contact_key') == key)) -%}{%- set ns.rows = [{'k': e.get('queued_at') or e.get('at') or '', 'e': e}] + ns.rows -%}{%- endif -%}
              {%- endfor -%}
              {#- the messages on their way, but one the history holds already (PC 20) -#}
              {%- for e in (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if e is mapping and e.get('id') not in ns.ids and ((e.get('kind') == 'channel' and e.get('channel_index') == chan) if chan >= 0 else (e.get('kind') == 'contact' and e.get('contact_key') == key)) -%}{%- set ns.rows = ns.rows + [{'k': e.get('queued_at') or '', 'e': e}] -%}{%- endfor -%}
              {#- oldest first, by acceptance or arrival; the sort is stable, so a batch of one time keeps its arrival order (D-17) -#}
              {%- set rows = ns.rows | sort(attribute='k') -%}
              {#- open: the newest, at most 6, past the second only while their texts stay within 360 characters (D-17) -#}
              {%- for r in rows | reverse -%}{%- set size = (r.e.get('text') or '') | string | length -%}{%- if not ns.stop and ns.open < 6 and (ns.open < 2 or ns.chars + size <= 360) -%}{%- set ns.open = ns.open + 1 -%}{%- set ns.chars = ns.chars + size -%}{%- else -%}{%- set ns.stop = true -%}{%- endif -%}{%- endfor -%}
              {%- set earlier = (rows | count - ns.open) | int -%}
              {%- for r in rows[:earlier] if r.e.get('direction') != 'in' and (r.e.get('state') in ['failed', 'expired'] or r.e.get('suspect') == true) -%}{%- set ns.trouble = ns.trouble + 1 -%}{%- endfor -%}
              {%- set trouble = ns.trouble | int -%}
              {%- if states['binary_sensor.@gw@_radio'] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif states[h] is none -%}
              <div>_("Chats need gateway version 2.1 or later. Ask your administrator to update the gateway.")</div>
              {%- elif all is none -%}
              <div>_("No messages known yet.")</div>
              {%- elif not rows -%}
              <div>_("No message here yet.")</div>
              {%- else -%}
              {%- if state_attr(h, 'truncated') == true -%}
              <div>_("Older messages are no longer kept for Home Assistant.")</div>
              {% endif -%}
              {%- if earlier > 0 -%}
              {#- Translators: a fold of the older messages of a chat; earlier and trouble are whole numbers -#}
              <details><summary>{% if trouble > 0 %}_("Earlier messages ({earlier}) · with problems: {trouble}"){% else %}_("Earlier messages ({earlier})"){% endif %}</summary>{%- for r in rows[:earlier] -%}{{ row(r.e) }}{%- endfor -%}</details>
              {% endif -%}
              <div>{%- for r in rows[earlier:] -%}{{ row(r.e) }}{%- endfor -%}</div>
              {%- endif %}
              {#- Translators: security text (docs/translations.md): what a tick proves and what it does not; a confirmation that came too soon may be forged #}
              <details><summary>_("What ✓ and ✓✓ mean")</summary><ul><li>_("✓ sent: it left the radio. Channels never confirm, so one tick is all a channel message gets.")</li><li>_("✓✓ delivered: the person's radio confirmed it. It does not say the person read it.")</li><li>_("⚠ delivered? maybe forged: the confirmation came faster than the mesh path normally allows. Ask in another way whether it arrived.")</li><li>_("✗ not delivered and ✗ not sent: waited too long show in yellow, with the reason. Send it again or ask in another way.")</li><li>_("… waiting to send, and a text in italics: the message is on its way.")</li><li>_("Left: received. Right: sent from this home, by anyone or by an automation.")</li><li>_("A direct message may end in a short code such as #1a2b3c4d; it is hidden here and makes a faked confirmation harder.")</li><li>_("Long keys and links are shown in pieces here. Copied into Contacts, they still work; pasted elsewhere, they may not.")</li><li>_("Help says what each reason in brackets means and what to do.") <a href="./help">_("Help")</a></li></ul></details>
# @if chats.write
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- if states[radio] is not none and (is_state(radio, 'unavailable') or is_state(radio, 'off')) -%}
              {%- if is_state(radio, 'unavailable') -%}
              <div><ha-alert alert-type="error"><b>_("You cannot write now: the gateway is offline.")</b> _("Writing comes back when it is.")</ha-alert></div>
              {%- else -%}
              <div><ha-alert alert-type="error"><b>_("The radio is disconnected.")</b> _("Messages wait and go out when it is back.")</ha-alert></div>
              {%- endif %}
              <details><summary>{% if is_state(radio, 'unavailable') %}_("Why you cannot write now"){% else %}_("Why messages wait"){% endif %}</summary><ul><li>_("The gateway sends what you write over its radio. While it is offline, Home Assistant cannot reach it, and the field is gone; the messages stay readable.")</li><li>_("While the radio is disconnected, a message you send waits at the gateway and goes out when the radio is back.")</li><li>_("If this lasts more than a few minutes, tell your administrator.")</li></ul></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            visibility:
              - condition: template
                value_template: >-
                  {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
                  {%- set t = '@chats.write@' -%}{%- set b = '@chats.send@' -%}{%- set d = device_id(t) -%}
                  {{ not (gw is not none and d is not none and device_id(b) == d
                     and states[t] is not none and not is_state(t, 'unavailable')
                     and states[b] is not none and not is_state(b, 'unavailable')
                     and (d == gw if '@chats.target@' != '' else
                          device_attr(d, 'via_device_id') == gw and
                          device_attr(d, 'serial_number') == '@chats.key@')) }}
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set key = '@chats.key@' -%}{%- set part = '@chats.target@' | replace('-', '_') -%}
              {%- set ns = namespace(field=none, device=none) -%}
              {#- the field this chat has on this gateway, found by its device: the gateway's for a target, the contact's for a person -#}
              {%- if gw is not none and part -%}
              {%- for e in device_entities(gw) | select('match', 'text\\.\\w+_write_' ~ part ~ '(_\\d+)?$') -%}{%- set ns.field = e -%}{%- endfor -%}
              {%- elif gw is not none -%}
              {%- for d in integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list if device_attr(d, 'serial_number') == key -%}{%- set ns.device = d -%}{%- for e in device_entities(d) | select('match', 'text\\.') -%}{%- set ns.field = e -%}{%- endfor -%}{%- endfor -%}
              {%- endif -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {#- a person's device gone, removed from the radio or hidden: the head says why, as S1 tests it -#}
              {%- set gone = '@chats.path@'.startswith('contact-') and not part and gw is not none and ns.device is none -%}
              {#- not found, offline or a gateway before 2.1: the thread and the line above say so -#}
              {%- set quiet = gw is none or states[radio] is none or is_state(radio, 'unavailable') or states['sensor.@gw@_message_history'] is none or gone -%}
              {%- if not quiet -%}
              {%- set real = m(ns.field) -%}
              {#- the field and the button under this page's own IDs, registered: then they are off, unavailable or on another device -#}
              {%- set field = '@chats.write@' -%}{%- set button = '@chats.send@' -%}
              {%- if ns.field is not none and ns.field != field and not is_state(ns.field, 'unavailable') -%}
              {#- Translators: real is the entity ID of the message field; the menus as Home Assistant's own translation names them -#}
              <div><ha-alert alert-type="warning"><b>_("You cannot write to {name} from here.")</b><br>_("For your administrator: this chat's message field has another name on this gateway: {real}. Rename it in Home Assistant's Settings › Devices & services › Entities, or set a contact prefix for this gateway.") <a href="@guide@#a-second-gateway">_("How, in the guide")</a></ha-alert></div>
              {%- elif ns.field is not none and is_state(ns.field, 'unavailable') -%}
              {#- Translators: name is the chat's title -#}
              <div><ha-alert alert-type="info">_("Only automations write to {name} from this home.")</ha-alert></div>
              {%- elif device_id(field) is not none or device_id(button) is not none -%}
              {#- Translators: name is the chat's title; the menus as Home Assistant's own translation names them, Send as the button's label is translated -#}
              <div><ha-alert alert-type="warning"><b>_("You cannot write to {name} from here.")</b><br>_("For your administrator: this chat's field or its Send button is disabled, unavailable or on another device. Check both in Home Assistant's Settings › Devices & services › Entities.")</ha-alert></div>
              {%- else -%}
              <div><ha-alert alert-type="warning"><b>_("You cannot write to {name} from here.")</b><br>_("Ask your administrator to make the dashboard again.")</ha-alert></div>
              {%- endif %}
              <details><summary>_("Why you cannot write here")</summary><ul><li>_("This page's field is missing, belongs to another gateway or contact, or is switched off on purpose.")</li><li>_("The messages stay readable here; your administrator can fix the field.")</li></ul></details>{%- endif -%}
