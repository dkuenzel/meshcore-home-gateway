              {%- set text = mt(raw[:60] ~ ('…' if raw | length > 60 else '')) -%}{%- set sender = m(e.get('name') or '?') -%}
              {%- if e.get('direction') == 'in' and e.get('kind') == 'channel' -%}
              {#- Translators: a channel message in one line: the sender's name, as the sender typed it, then the text -#}
              _("{sender}: {text}")
              {%- elif e.get('direction') == 'in' -%}{{ mt(raw[:60] ~ ('…' if raw | length > 60 else '')) }}
              {%- elif e.get('state') == 'failed' -%}
              {#- Translators: the text of a message sent from this home that the person's radio did not confirm -#}
              _("Sent: {text} – not delivered")
              {%- elif e.get('state') == 'expired' -%}
              {#- Translators: the text of a message that waited too long to be sent -#}
              _("Not sent: {text}")
              {%- else -%}
              {#- Translators: the text of a message sent from this home -#}
              _("Sent: {text}")
              {%- endif -%}
              {%- endmacro -%}
              {%- set h = 'sensor.@gw@_message_history' -%}
              {%- set all = state_attr(h, 'messages') or [] -%}
              {%- set ns = namespace(rows=[], ids=[], entries=[]) -%}
              {%- for e in all if e is mapping -%}{%- set ns.entries = ns.entries + [e] -%}{%- if e.get('id') -%}{%- set ns.ids = ns.ids + [e.get('id')] -%}{%- endif -%}{%- endfor -%}
              {%- for e in (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if e is mapping and e.get('id') not in ns.ids -%}{%- set ns.entries = ns.entries + [e] -%}{%- endfor -%}
              {%- for x in ["@chats@"] -%}
              {%- set c = namespace(e=none, k='', heard='') -%}
              {%- for e in ns.entries if ((e.get('kind') == 'channel' and e.get('channel_index') == x.channel) if x.channel >= 0 else (e.get('kind') == 'contact' and e.get('contact_key') == x.key)) -%}
              {%- set k = e.get('queued_at') or e.get('at') or '' -%}
              {%- if c.e is none or k > c.k -%}{%- set c.e = e -%}{%- set c.k = k -%}{%- endif -%}
              {%- if e.get('direction') == 'in' and (e.get('at') or '') > c.heard -%}{%- set c.heard = e.get('at') -%}{%- endif -%}
              {%- endfor -%}
              {%- set heard = c.heard | as_datetime(default=none) -%}
              {%- if c.e is not none -%}{%- set ns.rows = ns.rows + [dict(path=x.path, title=x.title, e=c.e, k=c.k, new=heard is not none and now() - heard < timedelta(minutes=15))] -%}{%- endif -%}
              {%- endfor -%}
