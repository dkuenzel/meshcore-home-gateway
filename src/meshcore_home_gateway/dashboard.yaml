              {%- set older = numbers and (numbers[0][0] | int, numbers[0][1] | int) < (@major@, @minor@) -%}
              {%- if running != '' and (not numbers or (numbers[0][0] | int, numbers[0][1] | int) != (@major@, @minor@)) -%}
              {%- set running = m(running) -%}
              {#- Translators: version and running are versions of the gateway, such as 2.1.0 -#}
              <div><ha-alert alert-type="warning"><b>_("This dashboard was made for version {version}; the gateway runs {running}.")</b> {% if older %}_("Ask your administrator to update the gateway to {version}."){% else %}_("Ask your administrator to make the dashboard again."){% endif %}</ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("A dashboard of another version can miss new cards or name entities that changed.")</p>{% if not older %}<p>_("Your administrator runs:") <code>meshcore-home-gateway dashboard</code></p>{% endif %}</details>{%- endif -%}
      - type: grid
