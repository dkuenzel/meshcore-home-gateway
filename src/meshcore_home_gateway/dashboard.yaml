          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro place(v) -%}
              {%- if v == 'home' -%}_("at home")
              {%- elif v == 'not_home' -%}_("away")
              {%- elif v == 'unavailable' -%}_("position not current")
              {%- elif v == 'unknown' -%}_("no position yet")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro asking(v) -%}
              {#- Translators: whether the gateway asks this person's device for its position and battery -#}
              {%- if v == 'on' -%}_("on")
              {%- elif v == 'off' -%}_("off")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}–
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro telemetry(v) -%}
              {#- Translators: what asking this person's device for its position and battery gives, after on or off (the device's telemetry state) -#}
              {%- if v == 'waiting' -%}_("not asked yet")
              {%- elif v == 'answering' -%}_("answering")
              {%- elif v == 'no_position' -%}_("answering, no position")
              {%- elif v == 'away' -%}_("no answer lately")
              {%- elif v == 'no_answer' -%}_("no answer for a day")
              {%- elif v == 'no_path' -%}_("not reachable now")
              {%- elif v == 'look_alike' -%}_("not asked: look-alike")
              {%- elif v == 'excluded' -%}_("not asked (switch off)")
              {%- elif v == 'off' -%}_("off for everyone")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set key = '@chats.key@' -%}{%- set chan = @chats.channel@ -%}
              {%- set ns = namespace(device=none, tracker=none, battery=none, asking=none, state=none, hops=none, snr=none) -%}
              {%- for d in ([] if gw is none or key == '' else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) if device_attr(d, 'serial_number') == key -%}{%- set ns.device = d -%}{%- endfor -%}
              {%- for e in (device_entities(ns.device) if ns.device is not none else []) -%}
              {%- if e is match('device_tracker\\.') -%}{%- set ns.tracker = e -%}
              {%- elif e is match('switch\\.') -%}{%- set ns.asking = e -%}
              {%- elif e is match('sensor\\.\\w+_telemetry_state(_\\d+)?$') -%}{%- set ns.state = e -%}
              {%- elif e is match('sensor\\.\\w+_battery(_\\d+)?$') and state_attr(e, 'device_class') == 'voltage' -%}{%- set ns.battery = e -%}
              {%- elif e is match('sensor\\.\\w+_hops(_\\d+)?$') -%}{%- set ns.hops = e -%}
              {%- elif e is match('sensor\\.\\w+_snr(_\\d+)?$') -%}{%- set ns.snr = e -%}
              {%- endif -%}
              {%- endfor -%}
              {%- set cfg = state_attr('sensor.@gw@_configuration', 'targets') -%}
              {%- set messages = state_attr('sensor.@gw@_configuration', 'messages') -%}
              {%- set t = namespace(found=none) -%}
              {%- for x in ((cfg.get('items') or []) if cfg is mapping else []) if x is mapping and x.get('alias') == '@chats.target@' -%}{%- set t.found = x -%}{%- endfor -%}
              {%- set room = (t.found.get('room') if t.found is not none and t.found.get('room') is number else @chats.room@) | int -%}
              {%- set where = states(ns.tracker) if ns.tracker is not none else 'unknown' -%}
              {%- set zone = m(where) -%}
              {#- a battery's voltage while it is current, as 3.9 -#}
              {%- set v = (states(ns.battery) | float(none)) if ns.battery is not none else none -%}
              {%- set volts = m('%.1f' | format(v) if v is not none else '') -%}
              {%- set prefix = m(t.found.get('prefix') if t.found is not none else '') -%}{%- set suffix = m(t.found.get('suffix') if t.found is not none else '') -%}
              {%- set short = m(key[:8]) -%}{%- set hops = m(states(ns.hops) if ns.hops is not none else '') -%}{%- set snr = m(states(ns.snr) if ns.snr is not none else '') -%}
              {%- set measured = ns.hops is not none and ns.snr is not none and states(ns.hops) not in ['unknown', 'unavailable'] and states(ns.snr) not in ['unknown', 'unavailable'] -%}
              {%- set word = states(ns.state) if ns.state is not none else '' -%}
              {%- if ns.device is not none %}
              {#- Translators: volts is a battery's voltage, such as 3.9 #}
              <table role="presentation" width="100%"><tr><td>_("Where")</td><td>{% if where in ['home', 'not_home', 'unavailable', 'unknown'] %}{{ place(where) }}{% else %}_("at {zone}"){% endif %}</td></tr><tr><td>_("Battery")</td><td>{% if volts %}_("{volts} V"){% else %}–{% endif %}</td></tr><tr><td>_("Ask for position and battery")</td><td>{{ asking(states(ns.asking) if ns.asking is not none else '') }}{% if word not in ['', 'unknown', 'unavailable'] %} · {{ telemetry(word) }}{% endif %}</td></tr></table>
              <div><a href="./contacts">_("Change on Contacts")</a></div>
              {%- endif %}
              {%- if t.found is not none and t.found.get('prefix') and t.found.get('suffix') %}
              {#- Translators: prefix and suffix are the texts the gateway adds before and after each message to this chat #}
              <div>_("Text before or after messages: {prefix} … {suffix}")</div>
              {%- elif t.found is not none and t.found.get('prefix') %}
              {#- Translators: prefix is the text the gateway adds before each message to this chat #}
              <div>_("Text before messages: {prefix}")</div>
              {%- elif t.found is not none and t.found.get('suffix') %}
              {#- Translators: suffix is the text the gateway adds after each message to this chat #}
              <div>_("Text after messages: {suffix}")</div>
              {%- endif %}
              {%- if t.found is not none and t.found.get('alert') == true %}
              <div>_("Sent before other messages.")</div>
              {%- endif %}
              {%- if '@chats.target@' and not (ns.device is not none) %}
              {#- Translators: room is a whole number #}
              <div>_("About {room} letters per message.")</div>
              {%- endif %}
              {#- Translators: name is the person's name or the chat's title; short the first 8 digits of the key; hops a whole number; snr the signal in dB, such as 6.25 #}
              <details><summary>{% if ns.device is not none %}_("About {name}'s entry"){% else %}_("About this chat"){% endif %}</summary><ul>{% if ns.device is not none %}<li><b>_("at home")</b>, <b>_("away")</b>: _("Where the device was at its last answer; a place's name when it was in another zone of Home Assistant.")</li><li><b>_("position not current")</b>: _("A position counts for an hour after the last answer.")</li><li><b>_("no position yet")</b>: _("GPS off, location not allowed in the app, out of range, or asking is off (Contacts).")</li><li>_("Ask for position and battery: on means the gateway asks this device for both now and then. Change it on Contacts. The words after on or off say how the device answers:")</li><li><b>_("not asked yet")</b>: _("The gateway has not asked yet, or not for over a day.")</li><li><b>_("answering")</b>: _("The answers are current and carry a position.")</li><li><b>_("answering, no position")</b>: _("The answers are current, without a position: GPS off, no fix, or location not allowed in the app.")</li><li><b>_("no answer lately")</b>: _("It answered today, not lately: out of range or switched off.")</li><li><b>_("no answer for a day")</b>: _("Asked, but no answer for a day: it does not allow this home, does not have it as a contact, or is out of range.")</li><li><b>_("not reachable now")</b>: _("Not asked: the radio has no way to it now. A message or an advert from it brings it back.")</li><li><b>_("not asked: look-alike")</b>: _("Another node's key starts the same, so an answer could not be told apart.")</li><li><b>_("not asked (switch off)")</b>: _("The switch is off for this person.")</li><li><b>_("off for everyone")</b>: _("Your administrator turned asking off in this home's settings.")</li><li>_("Its key starts with {short}.")</li>{% if measured %}<li>_("At its last message it was {hops} hops away, at a signal of {snr} dB.")</li>{% endif %}<li>_("The name comes from {name}'s own device and can change.")</li>{% endif %}{% if '@chats.target@' %}<li>_("Text before or after messages: the gateway adds it to every message sent here, and the chat shows it.")</li><li>_("Sent before other messages: an alert goes out before the messages that wait.")</li>{% elif ns.device is none %}<li>_("Where {name} is, the battery and asking show here while {name} is a contact of this radio.")</li>{% endif %}</ul></details>
# @if chats.write
    footer:
      card:
        type: vertical-stack
        visibility:
          - condition: template
            value_template: >-
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set t = '@chats.write@' -%}{%- set b = '@chats.send@' -%}{%- set d = device_id(t) -%}
              {{ gw is not none and d is not none and device_id(b) == d
                 and states[t] is not none and not is_state(t, 'unavailable')
                 and states[b] is not none and not is_state(b, 'unavailable')
                 and (d == gw if '@chats.target@' != '' else
                      device_attr(d, 'via_device_id') == gw and
                      device_attr(d, 'serial_number') == '@chats.key@') }}
        cards:
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mt(x) -%}{%- set brk = '\u200b' -%}{{ m(x) | regex_replace('((?:&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f][\u0300-\u036f\u0483-\u0489]*){20})(?=&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f])', '\\1' ~ brk) }}{%- endmacro -%}
              {#- the reasons of mqtt-api.md, Delivery; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'no_acknowledgement' -%}_("no acknowledgement")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'unknown_target' -%}_("no such target")
              {%- elif v == 'ambiguous_target' -%}_("another contact has the same key prefix")
              {%- elif v == 'not_a_companion' -%}_("not a companion")
              {%- elif v == 'channel_not_configured' -%}_("channel not set up on the radio")
              {%- elif v == 'too_long' -%}_("text too long")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("text not UTF-8")
              {%- elif v == 'empty' -%}_("empty text")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'queue_full' -%}_("queue full")
              {%- elif v == 'queue_ttl' -%}_("waited too long")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'airtime_budget' -%}_("airtime used up")
              {%- elif v == 'exceeds_airtime_burst' -%}_("needs more airtime than one burst")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'event.@gw@_delivery' -%}
              {%- set step = state_attr(e, 'event_type') -%}{%- set code = state_attr(e, 'reason') -%}
              {%- set at = states(e) | as_datetime(default=none) -%}
              {#- now(): the line goes 10 minutes after the refusal, also when nothing else changes -#}
              {%- set clock = now() -%}
              {%- set chan = @chats.channel@ -%}{%- set key = '@chats.key@' -%}
              {#- a refusal of this chat: its target is an alias of the chat's, or the person's key (D-15) -#}
              {%- set ours = ('@chats.aliases@'.split(',') if '@chats.aliases@' else []) + ([key] if key else []) -%}
              {%- set ns = namespace(later=false) -%}
              {#- a message of this chat accepted after the refusal ends its line -#}
              {%- for f in (state_attr('sensor.@gw@_message_history', 'messages') or []) + (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if f is mapping and ((f.get('kind') == 'channel' and f.get('channel_index') == chan) if chan >= 0 else (f.get('kind') == 'contact' and f.get('contact_key') == key)) -%}
              {%- set q = (f.get('queued_at') or '') | as_datetime(default=none) -%}
              {%- if q is not none and at is not none and q > at -%}{%- set ns.later = true -%}{%- endif -%}
              {%- endfor -%}
              {%- if step in ['rejected', 'duplicate'] and state_attr(e, 'target') in ours and at is not none and clock - at < timedelta(minutes=10) and not ns.later -%}
              {%- set reason = why(code) -%}
              {#- Translators: reason says why the gateway refused the message, such as text too long. Return (↵) is the keyboard's key: the same word as in the page's help on writing and in the name beside the Send button (Return, then Send); Send as the button's label is translated -#}
              <div><ha-alert alert-type="warning"><b>{% if step == 'duplicate' %}_("Not sent again: the same text went to this chat a moment ago."){% elif code == 'empty' %}_("Nothing was sent: the gateway had no text. Tap Return (↵) in the field (on a phone this also closes the keyboard), then Send."){% else %}_("Not sent: {reason}."){% endif %}</b>{% if state_attr(e, 'text') %}<br>{{ mt(state_attr(e, 'text')) }}{% endif %}</ha-alert></div>
              {%- endif -%}
          - type: entities
            entities:
              - entity: "@chats.write@"
                # Translators: the label of a chat's message field; name is the chat's title, a
                # channel or a person
                name: _("Write to {name}")
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
          - type: tile
            entity: "@chats.send@"
            # Translators: the name beside a chat's send button: the keyboard's key in the words
            # the phones of your language show, then the button's label exactly as translated
            name: _("Return, then Send")
            icon: mdi:send
            hide_state: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features_position: inline
            features:
              - type: button
                # Translators: the label on a chat's send button; keep it one short word
                action_name: _("Send")
# @end
# @end
