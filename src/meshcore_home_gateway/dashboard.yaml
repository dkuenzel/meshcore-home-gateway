                text: _("Settings")
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: ./settings
              - type: button
                text: _("Help")
                icon: mdi:help-circle
                tap_action:
                  action: navigate
                  navigation_path: ./help
          - type: heading
            heading: _("People and devices")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro telemetry(v) -%}
              {#- Translators: what asking this person's device for its position and battery gives (the device's telemetry state): on a chat page after on or off, on Contacts in the column Asking -#}
              {%- if v == 'waiting' -%}_("not asked yet")
              {%- elif v == 'answering' -%}_("answering")
              {%- elif v == 'no_position' -%}_("answering, no position")
              {%- elif v == 'away' -%}_("no answer lately")
              {%- elif v == 'no_answer' -%}_("no answer for a day")
              {%- elif v == 'no_path' -%}_("not reachable now")
              {%- elif v == 'look_alike' -%}_("not asked: look-alike")
              {%- elif v == 'excluded' -%}_("not asked (switch off)")
              {%- elif v == 'off' -%}_("off for everyone")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro node(v) -%}
              {#- Translators: what a contact is, under its name on Contacts: the words under a person's name in All chats -#}
              {%- if v == 'chat' -%}_("person")
              {%- elif v == 'repeater' -%}_("repeater")
              {%- elif v == 'room' -%}_("room")
              {%- elif v == 'sensor' -%}_("sensor")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, so a contact that got its device shows also when no row has a time yet -#}
              {%- set clock = now() -%}
              {#- a contact's type, from its device's model as the gateway names it in this dashboard's language (D-7) -#}
              {%- set models = dict(["@models@"]) -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set gw = device_id(radio) -%}
              {%- set count = states('sensor.@gw@_contacts') | int(0) -%}
              {%- set limit = state_attr('sensor.@gw@_contacts', 'max') | int(0) -%}
              {%- set ha = state_attr('sensor.@gw@_configuration', 'homeassistant') -%}
              {%- set hidden = 'button.@gw@_show_hidden' -%}
              {#- controls = false: from the configuration, or for a gateway before 2.1 from its controls, unavailable while the gateway is not (D-29) -#}
              {%- set off = (ha.get('controls') == false) if ha is mapping else (states[hidden] is not none and is_state(hidden, 'unavailable') and not is_state(radio, 'unavailable')) -%}
              {%- set code = state_attr('sensor.@gw@_contacts', 'manage_reason') -%}
              {%- set ns = namespace(rows=[]) -%}
              {#- this gateway's contacts, by their devices (D-31): the time heard, the telemetry state, the battery; a page of a chat with each -#}
              {%- for d in ([] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) -%}
              {%- set c = namespace(heard='', word='', battery=none, path='') -%}
              {%- for e in device_entities(d) if e is match('sensor\\.') -%}
              {%- if state_attr(e, 'device_class') == 'timestamp' -%}{%- set c.heard = states(e) if states(e) not in ['unknown', 'unavailable'] else '' -%}
              {%- elif 'answering' in (state_attr(e, 'options') or []) -%}{%- set c.word = states(e) -%}
              {%- elif e is match('sensor\\.\\w+_battery(_\\d+)?$') and state_attr(e, 'device_class') == 'voltage' -%}{%- set c.battery = states(e) | float(none) -%}
              {%- endif -%}
              {%- endfor -%}
              {%- for x in ["@chats@"] if x.key and x.key == device_attr(d, 'serial_number') -%}{%- set c.path = x.path -%}{%- endfor -%}
              {%- set ns.rows = ns.rows + [dict(heard=c.heard, name=device_attr(d, 'name_by_user') or device_attr(d, 'name') or '?', model=device_attr(d, 'model') or '', battery=c.battery, word=c.word, path=c.path)] -%}
              {%- endfor -%}
              {%- if states[radio] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- else -%}
              {%- if limit > 0 and states('sensor.@gw@_contacts') not in ['unknown', 'unavailable'] %}
              {#- Translators: count and limit are whole numbers: the contacts on the radio and how many it holds #}
              <div>_("{count} of {limit} contacts on the radio.")</div>
              {%- endif %}
              {%- if is_state(radio, 'unavailable') %}
              <div><ha-alert alert-type="error"><b>_("The gateway is offline.")</b> _("Contacts can be added and removed again once it is back.")</ha-alert></div>
              {%- elif is_state(radio, 'off') %}
              <div><ha-alert alert-type="error"><b>_("The radio is disconnected.")</b> _("Contacts can be added and removed again once it is back.")</ha-alert></div>
              {%- elif off %}
              <div><ha-alert alert-type="info">_("Your administrator turned these controls off: contacts are managed outside Home Assistant.")</ha-alert></div>
              {%- elif code == 'management_off' %}
              <div><ha-alert alert-type="info">_("The gateway adds and removes no contacts: your administrator turned that off.")</ha-alert></div>
              {%- elif code == 'no_radio' %}
              <div><ha-alert alert-type="info">_("The radio is not connected. Contacts can be added and removed again once it is.")</ha-alert></div>
              {%- elif code == 'untested_firmware' %}
              <div><ha-alert alert-type="warning">_("The radio's firmware is not tested with this gateway, so it adds and removes no contacts. Ask your administrator to update the gateway or the radio.")</ha-alert></div>
              {%- elif code %}
              <div><ha-alert alert-type="warning">_("Contacts cannot be added or removed now. Tell your administrator this code:") <code>{{ m(code) }}</code></ha-alert></div>
              {%- endif %}
              {%- if not ns.rows %}
              <div>_("No contact has a device in Home Assistant yet.")</div>
              {%- else %}
              {#- Translators: the columns of the contacts table; volts is a battery's voltage, such as 3.9, written with this language's decimal mark #}
              <table><tr><th>_("Name")</th><th>_("Heard")</th><th>_("Battery")</th><th>_("Asking")</th></tr>{%- for r in ns.rows | sort(attribute='heard', reverse=true) -%}{%- set volts = num(r.battery, 1) -%}<tr><td>{% if r.path %}<a href="./{{ m(r.path) }}">{{ m(r.name) }}</a>{% else %}{{ m(r.name) }}{% endif %}<br><small>{{ node(models.get(r.model, r.model)) }}</small></td><td>{{ when(r.heard) }}</td><td>{% if volts %}_("{volts} V"){% else %}–{% endif %}</td><td>{{ telemetry(r.word) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
              {%- endif %}
              <details><summary>_("What the words mean")</summary><ul><li><b>_("Heard")</b>: _("When the gateway last heard the device: a message, an advert, or an answer to asking.")</li><li><b>_("Battery")</b>: _("The device's battery at its last answer, while its answers are current.")</li><li><b>_("Asking")</b>: _("Whether the gateway asks the device for its position and battery, and how it answers:")</li><li><b>_("not asked yet")</b>: _("The gateway has not asked yet, or not for over a day.")</li><li><b>_("answering")</b>: _("The answers are current and carry a position.")</li><li><b>_("answering, no position")</b>: _("The answers are current, without a position: GPS off, no fix, or location not allowed in the app.")</li><li><b>_("no answer lately")</b>: _("It answered today, not lately: out of range or switched off.")</li><li><b>_("no answer for a day")</b>: _("Asked, but no answer for a day: it does not allow this home, does not have it as a contact, or is out of range.")</li><li><b>_("not reachable now")</b>: _("Not asked: the radio has no way to it now. A message or an advert from it brings it back.")</li><li><b>_("not asked: look-alike")</b>: _("Another node's key starts the same, so an answer could not be told apart.")</li><li><b>_("not asked (switch off)")</b>: _("The switch is off for this person.")</li><li><b>_("off for everyone")</b>: _("Your administrator turned asking off in this home's settings.")</li><li><b>_("person")</b>, <b>_("repeater")</b>, <b>_("room")</b>, <b>_("sensor")</b>: _("What the contact is: a person's radio, a radio that passes messages on, a room that keeps messages for a group, or a sensor that reports readings.")</li><li>_("A name with a link opens the chat with that person.")</li></ul></details>
          - type: heading
            heading: _("Sensors")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro num(v, digits=none) -%}{%- set f = v | float if v | is_number else none -%}{%- set f = f | round(digits) if f is not none and digits is not none else f -%}{%- if f is none -%}{{ m(v) }}{%- elif f % 1 == 0 -%}{{ m(f | int | string) }}{%- else -%}{{ m(f | string | replace('.', '@decimal@')) }}{%- endif -%}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro telemetry(v) -%}
              {#- Translators: what asking this person's device for its position and battery gives (the device's telemetry state): on a chat page after on or off, on Contacts in the column Asking -#}
              {%- if v == 'waiting' -%}_("not asked yet")
              {%- elif v == 'answering' -%}_("answering")
              {%- elif v == 'no_position' -%}_("answering, no position")
              {%- elif v == 'away' -%}_("no answer lately")
              {%- elif v == 'no_answer' -%}_("no answer for a day")
              {%- elif v == 'no_path' -%}_("not reachable now")
              {%- elif v == 'look_alike' -%}_("not asked: look-alike")
              {%- elif v == 'excluded' -%}_("not asked (switch off)")
              {%- elif v == 'off' -%}_("off for everyone")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}–
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, so a contact that got its device shows also when no row has a time yet -#}
              {%- set clock = now() -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set gw = device_id(radio) -%}
              {%- set ns = namespace(rows=[]) -%}
              {#- this gateway's contacts that report readings (_ch<channel>_ sensors), each reading with its name without the device's, its value and unit; signals left out -#}
              {%- for d in ([] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) -%}
              {%- set owner = device_attr(d, 'name_by_user') or device_attr(d, 'name') or '?' -%}
              {%- set c = namespace(heard='', word='', values=[], readings=0) -%}
              {%- for e in device_entities(d) | sort if e is match('sensor\\.') -%}
              {%- set label = (state_attr(e, 'friendly_name') or e) | string -%}
              {%- set label = label[owner | length + 1:] if label.startswith(owner ~ ' ') else label -%}
              {%- set value = states(e) if states(e) not in ['unknown', 'unavailable'] else '–' -%}
              {%- set unit = (state_attr(e, 'unit_of_measurement') or '') if value != '–' else '' -%}
              {%- if state_attr(e, 'device_class') == 'timestamp' -%}{%- set c.heard = states(e) if states(e) not in ['unknown', 'unavailable'] else '' -%}
              {%- elif 'answering' in (state_attr(e, 'options') or []) -%}{%- set c.word = states(e) -%}
              {%- elif e is match('sensor\\.\\w+_ch\\d+_\\w+$') -%}{%- set c.readings = c.readings + 1 -%}{%- set c.values = c.values + [(label ~ ' ' ~ (num(value) if value | is_number else value) ~ ' ' ~ unit) | trim] -%}
              {%- elif e is match('sensor\\.\\w+_battery(_\\d+)?$') and state_attr(e, 'device_class') == 'voltage' -%}{%- set volts = num(value, 1) if value | is_number else value -%}{%- set c.values = c.values + [(label ~ ' ' ~ volts ~ ' ' ~ unit) | trim] -%}
              {%- endif -%}
              {%- endfor -%}
              {%- if c.readings -%}{%- set ns.rows = ns.rows + [dict(heard=c.heard, name=owner, read=c.values | join(' · '), word=c.word)] -%}{%- endif -%}
              {%- endfor -%}
              {%- set asked = state_attr('sensor.@gw@_configuration', 'telemetry') -%}
              {%- if states[radio] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif not ns.rows -%}
              <div>_("No sensor reports readings.")</div>
              {%- if asked is mapping and 'sensor' not in (asked.get('ask_types') or []) %}
              <div>_("Sensors are not asked in this home's settings (your administrator).")</div>
              {%- endif %}
              {%- else -%}
              <table><tr><th>_("Name")</th><th>_("Heard")</th><th>_("Asking")</th></tr>{%- for r in ns.rows | sort(attribute='heard', reverse=true) -%}<tr><td><b>{{ m(r.name) }}</b><br><small>{{ m(r.read) }}</small></td><td>{{ when(r.heard) }}</td><td>{{ telemetry(r.word) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
              <details><summary>_("Where readings come from")</summary><ul><li>_("A sensor reports when the gateway asks it; your administrator decides which kinds of node are asked.")</li><li>_("Readings count for an hour after the last answer; then they show as –.")</li><li>_("Help explains the words under Asking.") <a href="./help">_("Help")</a></li></ul></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Ask for position and battery")
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set ha = state_attr('sensor.@gw@_configuration', 'homeassistant') -%}
              {%- set hidden = 'button.@gw@_show_hidden' -%}
              {#- controls = false: from the configuration, or for a gateway before 2.1 from its controls, unavailable while the gateway is not -#}
              {%- set off = (ha.get('controls') == false) if ha is mapping else (states[hidden] is not none and is_state(hidden, 'unavailable') and not is_state(radio, 'unavailable')) -%}
              {%- set telemetry = state_attr('sensor.@gw@_configuration', 'telemetry') -%}
              {%- if states[radio] is not none and (is_state(radio, 'unavailable') or off) -%}
              {%- if is_state(radio, 'unavailable') -%}
              <div><ha-alert alert-type="error">_("The gateway is offline. These controls come back when it is.")</ha-alert></div>
              {%- else -%}
              <div><ha-alert alert-type="info">_("Your administrator turned these controls off: contacts are managed outside Home Assistant.")</ha-alert></div>
              {%- endif %}
              <details><summary>_("Why the switches are missing")</summary><ul><li>_("While the gateway is offline, Home Assistant cannot reach it, so its controls are hidden.")</li><li>_("Your administrator can turn the contacts' controls off for everyone who uses Home Assistant; Settings shows it.")</li></ul></details>
              {%- elif states[radio] is not none and telemetry is mapping and telemetry.get('enabled') == false -%}
              <div><ha-alert alert-type="info">_("Your administrator turned asking off in this home's settings: the switches take effect once it is on.")</ha-alert></div>
              <details><summary>_("Why nobody is asked")</summary><ul><li>_("Asking for position and battery is off for everyone; Settings shows it. Each switch keeps whether its person would be asked.")</li></ul></details>{%- endif -%}
# @if switches
          - type: entities
            # while one of its rows shows: no empty frame (D-29, HC 10)
            visibility:
              - condition: template
                value_template: >-
                  {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
                  {%- set ns = namespace(shown=false) -%}
                  # @each switches
                  {%- if states['@switches.entity@'] is not none and not is_state('@switches.entity@', 'unavailable') and device_attr(device_id('@switches.entity@'), 'via_device_id') == gw and device_attr(device_id('@switches.entity@'), 'serial_number') == '@switches.key@' -%}{%- set ns.shown = true -%}{%- endif -%}
                  # @end
                  {{ gw is not none and ns.shown }}
            state_color: true
            entities:
# @each switches
              - type: conditional
                conditions:
                  - condition: template
                    value_template: >-
                      {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
                      {%- set e = '@switches.entity@' -%}
                      {{ gw is not none and states[e] is not none and not is_state(e, 'unavailable')
                         and device_attr(device_id(e), 'via_device_id') == gw
                         and device_attr(device_id(e), 'serial_number') == '@switches.key@' }}
                row:
                  entity: "@switches.entity@"
                  name: "@switches.title@"
# @end
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What asking does")</summary><ul><li>_("On: the gateway asks that person's device now and then for its position and battery.")</li><li>_("Only turn it on for people who agreed.")</li><li>_("Off: it stops asking. What Home Assistant already recorded stays until your administrator deletes it.")</li></ul></details>
# @else
          - type: markdown
            text_only: true
            content: |-
              <div>_("No contact can be asked yet.")</div>
              <details><summary>_("What asking does")</summary><ul><li>_("On: the gateway asks that person's device now and then for its position and battery.")</li><li>_("Only turn it on for people who agreed.")</li><li>_("Off: it stops asking. What Home Assistant already recorded stays until your administrator deletes it.")</li></ul></details>
# @end
          - type: markdown
            text_only: true
            show_empty: false
            visibility:
              - condition: template
                value_template: >-
                  {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
                  {%- set ns = namespace(hidden=false) -%}
                  # @each switches
                  {%- if not (states['@switches.entity@'] is not none and not is_state('@switches.entity@', 'unavailable') and device_attr(device_id('@switches.entity@'), 'via_device_id') == gw and device_attr(device_id('@switches.entity@'), 'serial_number') == '@switches.key@') -%}{%- set ns.hidden = true -%}{%- endif -%}
                  # @end
                  {{ gw is not none and ns.hidden }}
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(items=[], found=[]) -%}
              # @each switches
              {%- set ns.items = ns.items + [['@switches.entity@', '@switches.key@', '@switches.title@']] -%}
              # @end
              {#- each contact's control on this gateway, found by its device: under another entity ID than this dashboard's (D-30) -#}
              {%- set devices = [] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list -%}
              {%- for i in ns.items -%}
              {%- for d in devices if device_attr(d, 'serial_number') == i[1] -%}
              {%- for e in device_entities(d) | select('match', 'switch\\.') if e != i[0] -%}{%- set ns.found = ns.found + [[i[2], e]] -%}{%- endfor -%}
              {%- endfor -%}
              {%- endfor -%}
              {%- if ns.found -%}
              {%- for f in ns.found -%}
              {%- set who = m(f[0]) -%}{%- set real = m(f[1]) %}
              {#- Translators: who is a contact's name; real is the entity ID of the contact's switch or button on this gateway; the menus as Home Assistant's own translation names them #}
              <div><ha-alert alert-type="warning"><b>_("{who} cannot be changed here.")</b><br>_("For your administrator: on this gateway, this contact's control has another entity ID: {real}. Rename it in Home Assistant's Settings › Devices & services › Entities, or set a contact prefix for this gateway.") <a href="@guide@#a-second-gateway">_("How, in the guide")</a></ha-alert></div>
              {%- endfor %}
              <details><summary>_("Why a contact is missing above")</summary><ul><li>_("The list above has the entity IDs this dashboard was made with. Another gateway with a contact of the same name, or a contact prefix set later, gives this contact's controls other IDs.")</li></ul></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(keys=[], names=[]) -%}
              # @each switches
              {%- set ns.keys = ns.keys + ['@switches.key@'] -%}
              # @end
              {#- this gateway's contacts with such a control that this dashboard does not list: they got it after it was made -#}
              {%- for d in ([] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) if device_attr(d, 'serial_number') not in ns.keys -%}
              {%- for e in device_entities(d) | select('match', 'switch\\.') -%}{%- set ns.names = ns.names + [device_attr(d, 'name_by_user') or device_attr(d, 'name') or '?'] -%}{%- endfor -%}
              {%- endfor -%}
              {%- if ns.names -%}
              {%- set names = m(ns.names | unique | sort | join(', ')) -%}
              {#- Translators: names are contacts' names, separated by commas -#}
              <div><ha-alert alert-type="info">_("Not listed here yet: {names}. Ask your administrator to make the dashboard again.")</ha-alert></div>
              <details><summary>_("Why someone is not listed")</summary><ul><li>_("This page lists the contacts that had a device when the dashboard was made. A contact that got one later is listed once your administrator makes the dashboard again.")</li></ul></details>{%- endif -%}
      - type: grid
        cards:
          - type: heading
            heading: _("Add or remove")
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set ha = state_attr('sensor.@gw@_configuration', 'homeassistant') -%}
              {%- set hidden = 'button.@gw@_show_hidden' -%}
              {#- controls = false: from the configuration, or for a gateway before 2.1 from its controls, unavailable while the gateway is not (D-29) -#}
              {%- set off = (ha.get('controls') == false) if ha is mapping else (states[hidden] is not none and is_state(hidden, 'unavailable') and not is_state(radio, 'unavailable')) -%}
              {%- set code = state_attr('sensor.@gw@_contacts', 'manage_reason') -%}
              {%- if states[radio] is not none and (is_state(radio, 'unavailable') or is_state(radio, 'off') or off or code) -%}
              {%- if is_state(radio, 'unavailable') %}
              <div><ha-alert alert-type="error">_("The gateway is offline. These controls come back when it is.")</ha-alert></div>
              {%- elif is_state(radio, 'off') %}
              <div><ha-alert alert-type="error"><b>_("The radio is disconnected.")</b> _("Contacts can be added and removed again once it is back.")</ha-alert></div>
              {%- elif off %}
              <div><ha-alert alert-type="info">_("Your administrator turned these controls off: contacts are managed outside Home Assistant.")</ha-alert></div>
              {%- elif code == 'management_off' %}
              <div><ha-alert alert-type="info">_("The gateway adds and removes no contacts: your administrator turned that off.")</ha-alert></div>
              {%- elif code == 'no_radio' %}
              <div><ha-alert alert-type="info">_("The radio is not connected. Contacts can be added and removed again once it is.")</ha-alert></div>
              {%- elif code == 'untested_firmware' %}
