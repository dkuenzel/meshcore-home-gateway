              {%- for f in ns.found -%}
              {%- set who = m(f[0]) -%}{%- set real = m(f[1]) %}
              {#- Translators: who is a contact's name; real is the entity ID of the contact's switch or button on this gateway; the menus as Home Assistant's own translation names them #}
              <div><ha-alert alert-type="warning"><b>_("{who} cannot be changed here.")</b><br>_("For your administrator: on this gateway, this contact's control has another entity ID: {real}. Rename it in Home Assistant's Settings › Devices & services › Entities, or set a contact prefix for this gateway.") <a href="@guide@#a-second-gateway">_("How, in the guide")</a></ha-alert></div>
              {%- endfor %}
              <details><summary>_("Why a contact is missing above")</summary><ul><li>_("The list above has the entity IDs this dashboard was made with. Another gateway with a contact of the same name, or a contact prefix set later, gives this contact's controls other IDs.")</li></ul></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(keys=[], names=[]) -%}
              # @each removes
              {%- set ns.keys = ns.keys + ['@removes.key@'] -%}
              # @end
              {#- this gateway's contacts with such a control that this dashboard does not list: they got it after it was made -#}
              {%- for d in ([] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list) if device_attr(d, 'serial_number') not in ns.keys -%}
              {%- for e in device_entities(d) | select('match', 'button\\.\\w+_remove(_\\d+)?$') -%}{%- set ns.names = ns.names + [device_attr(d, 'name_by_user') or device_attr(d, 'name') or '?'] -%}{%- endfor -%}
              {%- endfor -%}
              {%- if ns.names -%}
              {%- set names = m(ns.names | unique | sort | join(', ')) -%}
              {#- Translators: names are contacts' names, separated by commas -#}
              <div><ha-alert alert-type="info">_("Not listed here yet: {names}. Ask your administrator to make the dashboard again.")</ha-alert></div>
              <details><summary>_("Why someone is not listed")</summary><ul><li>_("This page lists the contacts that had a device when the dashboard was made. A contact that got one later is listed once your administrator makes the dashboard again.")</li></ul></details>{%- endif -%}
          - type: entities
            visibility:
              - condition: template
