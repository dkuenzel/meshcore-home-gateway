              {%- for d in ([] if gw is none else integration_entities('mqtt') | select('match', 'notify\\.') | map('device_id') | reject('none') | unique | list) if device_attr(d, 'via_device_id') == gw and device_attr(d, 'serial_number') not in ns.keys -%}{%- set ns.without = ns.without + [device_attr(d, 'name_by_user') or device_attr(d, 'name') or '?'] -%}{%- endfor -%}
              {%- for e in ns.entries if e.get('kind') == 'channel' and e.get('channel_index') is number and e.get('channel_index') not in ns.channels and e.get('channel_index') not in ns.heard -%}{%- set ns.heard = ns.heard + [e.get('channel_index')] -%}{%- endfor -%}
              {#- Translators: a channel of the radio without a chat page; n is its number -#}
              {%- macro numbered(v) -%}{%- for c in v | sort -%}{%- set n = c | int -%}_("channel {n}"){% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {%- set names = m(ns.without | sort | join(', ')) -%}{%- set channels = numbered(ns.heard) -%}
              {%- if states['binary_sensor.@gw@_radio'] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif not ns.rows -%}
              <div>_("No one to write to yet. The administrator sets up channels, and makes a chat page for each contact you add under Contacts.")</div>
              {%- else -%}
              {#- Translators: new marks a chat with a message received less than 15 minutes ago -#}
              <table role="presentation" width="100%">{%- for r in ns.rows | sort(attribute='k', reverse=true) | sort(attribute='quiet') -%}<tr><td><a href="./{{ m(r.path) }}"><b>{{ m(r.title) }}</b></a><br><small>{{ kind(r.kind) }}</small>{% if r.e is not none %}<br><small>{{ line(r.e) }}</small>{% endif %}</td><td align="right" valign="top"><small>{% if r.e is not none %}{{ when(r.k) }}{% endif %}{% if r.new %} · _("new"){% endif %}</small></td></tr>{%- endfor -%}</table>
              {%- endif %}
              {%- if ns.without %}
              {#- Translators: names are contacts' names, separated by commas #}
              <div>_("Without a chat page yet (your administrator makes them): {names}")</div>
              {%- endif %}
              {%- if ns.heard %}
              {#- Translators: channels are the radio's channels without a chat page, such as channel 5, channel 7 #}
              <div>_("Channels heard without a chat page: {channels}")</div>
              {%- endif %}
              {#- Translators: security text (docs/translations.md): who can read a chat, and that a name on a channel proves nothing #}
              <details><summary>_("Who reads what")</summary><ul><li>_("A channel is shared by everyone who has its key, also outside this home; a name shown on a channel is what the sender typed: anyone can type any name.")</li><li>_("A person's chat is direct: only that person's device can read it.")</li><li>_("Everyone in this home who uses Home Assistant reads and writes these chats.")</li><li>_("A chat marked only automations write here has no field: your administrator keeps it for automations.")</li><li>_("New: a message arrived less than 15 minutes ago.")</li><li>_("A contact added later gets a chat page when the administrator makes the dashboard again.")</li></ul></details>
      - type: grid
        cards:
          - type: heading
            heading: _("Latest messages")
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mt(x) -%}{%- set brk = '\u200b' -%}{{ m(x) | regex_replace('((?:&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f][\u0300-\u036f\u0483-\u0489]*){20})(?=&[#0-9a-zA-Z]+;|[!-%(-~\u00a0-\u024f\u0370-\u03ff\u0400-\u0482\u048a-\u04ff\u2007\u2011\u202f])', '\\1' ~ brk) }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro mark(v) -%}
              {#- Translators: how far a message sent from this home came, after its time -#}
              {%- if v == 'sent' -%}_("✓ sent")
              {%- elif v == 'confirmed' -%}_("✓✓ delivered")
              {#- Translators: security text (docs/translations.md): the confirmation came sooner than the message's way through the mesh allows -#}
              {%- elif v == 'suspect' -%}_("⚠ delivered? maybe forged")
              {%- elif v == 'failed' -%}_("✗ not delivered")
              {%- elif v == 'expired' -%}_("✗ not sent: waited too long")
              {%- elif v == 'queued' -%}_("… waiting to send")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- the reasons of mqtt-api.md, Delivery; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'no_acknowledgement' -%}_("no acknowledgement")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'unknown_target' -%}_("no such target")
              {%- elif v == 'ambiguous_target' -%}_("another contact has the same key prefix")
              {%- elif v == 'not_a_companion' -%}_("not a companion")
              {%- elif v == 'channel_not_configured' -%}_("channel not set up on the radio")
              {%- elif v == 'too_long' -%}_("text too long")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("text not UTF-8")
              {%- elif v == 'empty' -%}_("empty text")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'queue_full' -%}_("queue full")
              {%- elif v == 'queue_ttl' -%}_("waited too long")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'airtime_budget' -%}_("airtime used up")
              {%- elif v == 'exceeds_airtime_burst' -%}_("needs more airtime than one burst")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- macro label(e) -%}
              {%- set c = namespace(title='') -%}
              {%- for x in ["@chats@"] if not c.title and ((x.channel >= 0 and e.get('kind') == 'channel' and e.get('channel_index') == x.channel) or (x.channel < 0 and x.key != '' and e.get('kind') == 'contact' and e.get('contact_key') == x.key)) -%}{%- set c.title = x.title -%}{%- endfor -%}
              {%- set n = e.get('channel_index') | int(0) -%}
              {%- if c.title -%}{{ m(c.title) }}
              {%- elif e.get('kind') == 'channel' -%}
              {#- Translators: a channel of the radio without a chat page; n is its number -#}
              _("channel {n}")
              {%- else -%}{{ m(e.get('name') or '?') }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro entry(e) -%}
              {%- set raw = (e.get('text') or '') | string -%}
              {#- a direct message sent from this home ends in the code of confirm_nonce, also while it is on its way (no direction yet): hidden (PC 16) -#}
              {%- set raw = raw | regex_replace(' #[0-9a-f]{8}$', '') if e.get('direction') != 'in' and e.get('kind') == 'contact' else raw -%}
              {%- set trouble = e.get('direction') != 'in' and (e.get('state') in ['failed', 'expired'] or e.get('suspect') == true) -%}
              {%- set state = 'suspect' if e.get('state') == 'confirmed' and e.get('suspect') == true else (e.get('state') or e.get('step') or '') -%}
              {%- set attempt = e.get('attempt') | int(0) -%}{%- set attempts = e.get('max_attempts') | int(0) -%}{%- set later = when(e.get('at')) -%}
              {%- set sender = m(e.get('name') or '?') -%}{%- set chat = label(e) -%}
              {%- if e.get('direction') == 'in' -%}
              {#- Translators: who wrote a message of Latest messages: sender is the name the sender gave, chat the chat it came in -#}
              <table role="presentation" width="100%"><tr><td width="85%" align="left"><small><b>{% if e.get('kind') == 'channel' %}_("{sender} in {chat}"){% elif not e.get('contact_key') %}_("{sender} (not a contact)"){% else %}{{ m(e.get('name') or '?') }}{% endif %}</b> · {{ when(e.get('at')) }}</small><br>{{ mt(raw) }}</td><td width="15%"></td></tr></table>
              {%- else -%}
              {#- Translators: on its way: attempt and attempts are whole numbers; ✓✓ {later}: delivered, later the time the person's radio confirmed it, such as 10:34; to {chat}: to whom it went, chat is a chat's name -#}
              <table role="presentation" width="100%"><tr><td width="15%"></td><td width="85%" align="right">{% if trouble %}<ha-alert alert-type="warning">{% endif %}<small>_("to {chat}") · {{ when(e.get('queued_at') or e.get('at')) }} · {% if state == 'sent' and e.get('step') %}_("… sent, waiting for confirmation (try {attempt} of {attempts})"){% elif state == 'confirmed' and e.get('queued_at') and when(e.get('queued_at')) != later %}_("✓✓ {later}"){% else %}{{ mark(state) }}{% endif %}{% if trouble and e.get('reason') and not (state == 'expired' and e.get('reason') == 'queue_ttl') %} ({{ why(e.get('reason')) }}){% endif %}</small><br>{% if e.get('step') %}<i>{{ mt(raw) }}</i>{% else %}{{ mt(raw) }}{% endif %}{% if trouble %}</ha-alert>{% endif %}</td></tr></table>
              {%- endif -%}
              {%- endmacro -%}
              {%- set h = 'sensor.@gw@_message_history' -%}
              {%- set all = state_attr(h, 'messages') -%}
              {%- set ns = namespace(rows=[], ids=[], open=0, chars=0, stop=false, trouble=0) -%}
              {#- every chat's messages -#}
              {%- for e in (all or []) if e is mapping -%}
              {%- if e.get('id') -%}{%- set ns.ids = ns.ids + [e.get('id')] -%}{%- endif -%}
              {%- if true -%}{%- set ns.rows = [{'k': e.get('queued_at') or e.get('at') or '', 'e': e}] + ns.rows -%}{%- endif -%}
              {%- endfor -%}
              {#- the messages on their way, but one the history holds already (PC 20) -#}
              {%- for e in (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if e is mapping and e.get('id') not in ns.ids -%}{%- set ns.rows = ns.rows + [{'k': e.get('queued_at') or '', 'e': e}] -%}{%- endfor -%}
              {#- oldest first, by acceptance or arrival; the sort is stable, so a batch of one time keeps its arrival order (D-17) -#}
              {%- set rows = ns.rows | sort(attribute='k') -%}
              {#- open: the newest, at most 6, past the second only while their texts stay within 360 characters (D-17) -#}
              {%- for r in rows | reverse -%}{%- set size = (r.e.get('text') or '') | string | length -%}{%- if not ns.stop and ns.open < 6 and (ns.open < 2 or ns.chars + size <= 360) -%}{%- set ns.open = ns.open + 1 -%}{%- set ns.chars = ns.chars + size -%}{%- else -%}{%- set ns.stop = true -%}{%- endif -%}{%- endfor -%}
              {%- set earlier = (rows | count - ns.open) | int -%}
              {%- for r in rows[:earlier] if r.e.get('direction') != 'in' and (r.e.get('state') in ['failed', 'expired'] or r.e.get('suspect') == true) -%}{%- set ns.trouble = ns.trouble + 1 -%}{%- endfor -%}
              {%- set trouble = ns.trouble | int -%}
              {%- if states['binary_sensor.@gw@_radio'] is none -%}
              <div>_("The gateway is not found: see the first line of Overview.")</div>
              {%- elif states[h] is none -%}
              <div>_("Chats need gateway version 2.1 or later. Ask your administrator to update the gateway.")</div>
              {%- elif all is none -%}
              <div>_("No messages known yet.")</div>
              {%- elif not rows -%}
              <div>_("No message yet.")</div>
              {%- else -%}
              {%- if state_attr(h, 'truncated') == true -%}
              <div>_("Older messages are no longer kept for Home Assistant.")</div>
              {% endif -%}
              {%- if earlier > 0 -%}
              {#- Translators: a fold of the older messages of a chat; earlier and trouble are whole numbers -#}
              <details><summary>{% if trouble > 0 %}_("Earlier messages ({earlier}) · with problems: {trouble}"){% else %}_("Earlier messages ({earlier})"){% endif %}</summary>{%- for r in rows[:earlier] -%}{{ entry(r.e) }}{%- endfor -%}</details>
              {% endif -%}
              <div>{%- for r in rows[earlier:] -%}{{ entry(r.e) }}{%- endfor -%}</div>
              {%- endif %}
              {#- Translators: security text (docs/translations.md): what a tick proves and what it does not; a confirmation that came too soon may be forged #}
              <details><summary>_("What ✓ and ✓✓ mean")</summary><ul><li>_("✓ sent: it left the radio. Channels never confirm, so one tick is all a channel message gets.")</li><li>_("✓✓ delivered: the person's radio confirmed it. It does not say the person read it.")</li><li>_("⚠ delivered? maybe forged: the confirmation came faster than the mesh path normally allows. Ask in another way whether it arrived.")</li><li>_("✗ not delivered and ✗ not sent: waited too long show in yellow, with the reason. Send it again or ask in another way.")</li><li>_("… waiting to send, and a text in italics: the message is on its way.")</li><li>_("Left: received. Right: sent from this home, by anyone or by an automation.")</li><li>_("A direct message may end in a short code such as #1a2b3c4d; it is hidden here and makes a faked confirmation harder.")</li><li>_("Long keys and links are shown in pieces here. Copied into Contacts, they still work; pasted elsewhere, they may not.")</li><li>_("Help says what each reason in brackets means and what to do.") <a href="./help">_("Help")</a></li></ul></details>
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("What this view is for")</summary><p>_("All conversations: tap one to read it as a chat and to write. Below, all messages together, newest last.")</p><p><a href="./help">_("Help")</a></p></details>
  # Translators: a tab's title. Overview, Chats and Contacts together have at most 22 letters,
  # or the tabs do not fit a phone 360 pixels wide
  - title: _("Contacts")
    path: contacts
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Contacts on the radio")
            badges:
              - type: button
                text: _("Gateway")
                icon: mdi:router-wireless
                tap_action:
                  action: navigate
                  navigation_path: ./gateway
              - type: button
                text: _("Settings")
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: ./settings
              - type: button
                text: _("Help")
                icon: mdi:help-circle
                tap_action:
                  action: navigate
                  navigation_path: ./help
          - type: tile
            entity: sensor.@gw@_contacts
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro ago(value) -%}
              {%- set t = value | as_datetime(default=none) -%}
              {%- if t is none -%}–{%- else -%}
              {%- set s = (now() - t).total_seconds() | int -%}
              {#- Translators: how long ago; n is a whole number -#}
              {%- if s < 3600 -%}{%- set n = [s // 60, 0] | max -%}_("{n} min ago"){%- elif s < 86400 -%}{%- set n = s // 3600 -%}_("{n} h ago"){%- else -%}{%- set n = s // 86400 -%}_("{n} d ago"){%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro telemetry(v) -%}
              {%- if v == 'waiting' -%}_("waiting")
              {%- elif v == 'answering' -%}_("answering")
              {%- elif v == 'no_position' -%}_("no position")
              {%- elif v == 'away' -%}_("away")
              {%- elif v == 'no_answer' -%}_("no answer")
              {%- elif v == 'no_path' -%}_("no path")
              {%- elif v == 'look_alike' -%}_("look-alike")
              {%- elif v == 'excluded' -%}_("excluded")
              {%- elif v == 'off' -%}_("off")
              {%- elif v in ['', 'unknown', 'unavailable'] -%}–
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, so a new contact shows also when no row has a time yet -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for e in integration_entities('mqtt') | select('match', 'sensor\\.@contact@_.+_last_heard(_\\d+)?$') if gw and device_attr(e, 'via_device_id') == gw -%}
              {%- set device = device_id(e) -%}
              {%- set tn = namespace(state='') -%}
              {%- for s in device_entities(device) | select('match', 'sensor\\.@contact@_.+_telemetry_state(_\\d+)?$') -%}{%- set tn.state = states(s) -%}{%- endfor -%}
              {%- set ns.rows = ns.rows + [[states(e) if states(e) not in ['unknown', 'unavailable'] else '', device_attr(device, 'name_by_user') or device_attr(device, 'name') or '?', device_attr(device, 'model') or '', tn.state]] -%}
              {%- endfor -%}
              {%- if not ns.rows -%}
              _("No contact has a device in Home Assistant.")
              {%- else -%}
              <table><tr><th>_("Name")</th><th>_("Type")</th><th>_("Heard")</th><th>_("Telemetry")</th></tr>{%- for r in ns.rows | sort(attribute=0, reverse=true) -%}<tr><td>{{ m(r[1]) }}</td><td>{{ m(r[2]) }}</td><td>{{ ago(r[0]) }}</td><td>{{ telemetry(r[3]) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
# @if controls
          - type: entities
            title: _("Telemetry and removal")
            state_color: true
            entities: ["@controls@"]
# @end
          - type: entities
            title: _("Add a contact")
            entities:
              - entity: select.@gw@_add_node
              - entity: text.@gw@_add_contact
          - type: markdown
            title: _("Last contact event")
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro ago(value) -%}
              {%- set t = value | as_datetime(default=none) -%}
              {%- if t is none -%}–{%- else -%}
              {%- set s = (now() - t).total_seconds() | int -%}
              {#- Translators: how long ago; n is a whole number -#}
              {%- if s < 3600 -%}{%- set n = [s // 60, 0] | max -%}_("{n} min ago"){%- elif s < 86400 -%}{%- set n = s // 3600 -%}_("{n} h ago"){%- else -%}{%- set n = s // 86400 -%}_("{n} d ago"){%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro what(v) -%}
              {%- if v == 'added' -%}_("added to the radio")
              {%- elif v == 'removed' -%}_("removed from the radio")
              {%- elif v == 'hidden' -%}_("device deleted in Home Assistant")
              {%- elif v == 'shown' -%}_("device back in Home Assistant")
              {%- elif v == 'refused' -%}_("request refused")
              {%- elif v == 'failed' -%}_("request failed")
              {%- elif v == 'excluded' -%}_("excluded from telemetry")
              {%- elif v == 'included' -%}_("included in telemetry")
              {%- elif v == 'position_in_advert' -%}_("shares its position in adverts")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- the reasons of mqtt-api.md, Managing contacts and Excluding; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'invalid_request' -%}_("invalid request")
              {%- elif v == 'invalid_link' -%}_("no key, link or contact card")
              {%- elif v == 'unsupported_link' -%}_("a link of another kind")
              {%- elif v == 'unsupported_type' -%}_("unsupported node type")
              {%- elif v == 'unknown_node' -%}_("no heard node or contact of that name")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'management_off' -%}_("contact management is off")
              {%- elif v == 'own_key' -%}_("the gateway's own key")
              {%- elif v == 'protected' -%}_("a target or command sender")
              {%- elif v == 'busy' -%}_("too many requests waiting")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'untested_firmware' -%}_("firmware not tested")
              {%- elif v == 'rate_limited' -%}_("too many requests")
              {%- elif v == 'already_contact' -%}_("already a contact")
              {%- elif v == 'look_alike' -%}_("another contact has the same key prefix")
              {%- elif v == 'table_full' -%}_("contact table full")
              {%- elif v == 'not_confirmed' -%}_("the radio's table does not show it")
              {%- elif v == 'outcome_unknown' -%}_("outcome unknown: the next table read tells")
              {%- elif v == 'not_a_companion' -%}_("never asked for telemetry")
              {%- elif v == 'too_many' -%}_("too many keys stored")
              {%- elif v == 'not_saved' -%}_("in effect, not stored yet")
              {%- elif v == 'not_forgotten' -%}_("in effect, history not deleted")
              {%- elif v == 'state_unwritable' -%}_("cannot be stored")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("request not UTF-8")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'event.@gw@_contact' -%}
              {%- set kind = state_attr(e, 'event_type') -%}
              {%- if kind is none -%}
              _("No contact event yet.")
              {%- else -%}
              {%- set reason = state_attr(e, 'reason') -%}
              <div><b>{{ m(state_attr(e, 'name') or state_attr(e, 'prefix') or '?') }}</b> {{ what(kind) }}{% if reason %} ({{ why(reason) }}){% endif %} {{ ago(states(e)) }}</div>
              {%- endif %}
      - type: grid
        cards:
          - type: heading
            heading: _("Nodes heard")
          - type: tile
            entity: sensor.@gw@_nodes
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set options = state_attr('select.@gw@_add_node', 'options') -%}
              {%- if options is none -%}
              _("The gateway's controls are not in Home Assistant yet.")
              {%- elif not options -%}
              _("No companion, room server or sensor heard that is not a contact.")
              {%- else -%}
              <table>{%- for o in options -%}<tr><td>{{ m(o) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
          - type: markdown
            title: _("Add the gateway in the MeshCore app")
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set link = state_attr('binary_sensor.@gw@_radio', 'contact_link') -%}
              {%- if link -%}
              <ha-qr-code data="{{ m(link) }}" scale="4"></ha-qr-code>
              {%- else -%}
              _("The radio is not known yet.")
              {%- endif %}
  - title: _("Map")
