                  {%- if not (states['@removes.entity@'] is not none and not is_state('@removes.entity@', 'unavailable') and device_attr(device_id('@removes.entity@'), 'via_device_id') == gw and device_attr(device_id('@removes.entity@'), 'serial_number') == '@removes.key@') -%}{%- set ns.hidden = true -%}{%- endif -%}
