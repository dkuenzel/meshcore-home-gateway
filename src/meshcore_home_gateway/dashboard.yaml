              {%- elif not ns.rows -%}
              <div>_("No message yet. Open a chat to write the first one.")</div>
              {%- else -%}
              {#- Translators: new marks a chat with a message received less than 15 minutes ago -#}
              <table role="presentation" width="100%">{%- for r in (ns.rows | sort(attribute='k', reverse=true))[:3] -%}<tr><td><a href="./{{ m(r.path) }}"><b>{{ m(r.title) }}</b></a><br><small>{{ line(r.e) }}</small></td><td align="right" valign="top"><small>{{ when(r.e.get('at') or r.e.get('queued_at')) }}{% if r.new %} · _("new"){% endif %}</small></td></tr>{%- endfor -%}</table>
              {%- endif %}
              <div><a href="./messages">_("All chats")</a></div>
              <details><summary>_("How chats work")</summary><ul><li>_("Tap a name to open the chat and write.")</li><li>_("Everyone in this home who uses Home Assistant reads and writes the same chats.")</li><li>_("New: a message arrived less than 15 minutes ago.")</li><li>_("The last 50 messages are kept here, fewer when they are long.")</li></ul></details>
      - type: grid
