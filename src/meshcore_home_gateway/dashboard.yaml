# meshcore-home-gateway dashboard for node @node@, made by version @version@.
# Generated: do not edit; generate it again after an update (docs/home-assistant.md, Dashboard).
# Translators: the dashboard's title, above its views
title: _("Mesh")
views:
  # Translators: a tab's title. Overview, Chats and Contacts together have at most 22 letters,
  # or the tabs do not fit a phone 360 pixels wide
  - title: _("Overview")
    path: overview
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro problem(v) -%}
              {#- Translators: the problems the first line of Overview names, after Needs a look: in lower case, so that they read as one sentence -#}
              {%- if v == 'degraded' -%}_("a fault in the gateway")
              {%- elif v == 'look_alike' -%}_("a node imitates a contact")
              {%- elif v == 'remote_cli' -%}_("remote access to the radio")
              {%- elif v == 'advert_position' -%}_("a position broadcast to everyone")
              {%- elif v == 'profile' -%}_("the radio's settings")
              {%- elif v == 'telemetry' -%}_("asking for position and battery is paused")
              {%- elif v == 'clock' -%}_("the radio's clock")
              {%- elif v == 'full' -%}_("the contact table is full")
              {%- elif v == 'version' -%}_("the dashboard and the gateway are of different versions")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- set radio = 'binary_sensor.@gw@_radio' -%}
              {%- set offset = states('sensor.@gw@_radio_clock_offset') | float(0) -%}
              {%- set count = states('sensor.@gw@_contacts') | int(0) -%}
              {%- set limit = state_attr('sensor.@gw@_contacts', 'max') | int(0) -%}
              {%- set paused = states('sensor.@gw@_telemetry_status') == 'paused' -%}
              {%- set reason = state_attr('sensor.@gw@_telemetry_status', 'reason') -%}
              {%- set running = (state_attr(radio, 'bridge_version') or '') | string -%}
              {%- set numbers = running | regex_findall('^(\\d+)\\.(\\d+)') -%}
              {%- set other = running != '' and (not numbers or (numbers[0][0] | int, numbers[0][1] | int) != (@major@, @minor@)) -%}
              {%- set link = states(radio) -%}
              {%- set ns = namespace(yellow=[], blue=0, waiting=0) -%}
              {%- for e in (state_attr('sensor.@gw@_pending_messages', 'messages') or []) if e is mapping and e.get('step') == 'queued' -%}
              {%- set t = (e.get('queued_at') or '') | as_datetime(default=none) -%}
              {%- if t is not none and now() - t > timedelta(seconds=60) -%}{%- set ns.waiting = ns.waiting + 1 -%}{%- endif -%}
              {%- endfor -%}
              {%- if is_state('binary_sensor.@gw@_degraded', 'on') -%}{%- set ns.yellow = ns.yellow + ['degraded'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.@gw@_look_alike', 'on') -%}{%- set ns.yellow = ns.yellow + ['look_alike'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.@gw@_remote_cli', 'on') -%}{%- set ns.yellow = ns.yellow + ['remote_cli'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.@gw@_advert_position', 'on') -%}{%- set ns.yellow = ns.yellow + ['advert_position'] -%}{%- endif -%}
              {%- if states('sensor.@gw@_profile') in ['problem', 'drift'] -%}{%- set ns.yellow = ns.yellow + ['profile'] -%}{%- endif -%}
              {%- if paused and reason in ['first_start', 'radio_airtime'] -%}{%- set ns.blue = ns.blue + 1 -%}{%- elif paused and reason != 'no_radio' -%}{%- set ns.yellow = ns.yellow + ['telemetry'] -%}{%- endif -%}
              {%- if offset | abs >= 300 -%}{%- set ns.yellow = ns.yellow + ['clock'] -%}{%- endif -%}
              {%- if limit > 0 and count >= limit -%}{%- set ns.yellow = ns.yellow + ['full'] -%}{%- endif -%}
              {%- if other -%}{%- set ns.yellow = ns.yellow + ['version'] -%}{%- endif -%}
              {%- set n = ns.yellow | count -%}{%- set more = (n - 1) | int -%}{%- set notes = ns.blue | int -%}{%- set waiting = ns.waiting | int -%}
              {%- set first = problem(ns.yellow[0] if n else '') -%}
              {%- if states[radio] is none -%}
              {#- Translators: node is the gateway's node ID, such as radio1 -#}
              <div><ha-alert alert-type="error"><b>_("Gateway not found.")</b><br>_("This dashboard cannot reach the gateway. Tell your administrator.")<br><small>_("For your administrator: Home Assistant has no entity of node {node}. Check MQTT discovery, or make this dashboard for the right node.")</small></ha-alert></div>
              {%- elif link == 'unavailable' -%}
              <div><ha-alert alert-type="error"><b>_("Gateway offline.")</b><br>_("Nothing is sent or received. Messages stay readable.") _("If this lasts more than a few minutes, tell your administrator.")</ha-alert></div>
              {%- elif link == 'off' -%}
              <div><ha-alert alert-type="error"><b>_("Radio disconnected.")</b><br>_("The gateway runs but cannot reach its radio. Messages wait.") _("If this lasts more than a few minutes, tell your administrator.")</ha-alert></div>
              {%- elif is_state('binary_sensor.@gw@_radio_link_contested', 'on') -%}
              <div><ha-alert alert-type="error"><b>_("Radio taken over by another program.")</b><br>_("Act now: see the red card below.")</ha-alert></div>
              {%- elif link != 'on' -%}
              <div><ha-alert alert-type="info"><b>_("No report yet.")</b><br>_("The gateway has not reported since Home Assistant started.") _("If this lasts more than a few minutes, tell your administrator.")</ha-alert></div>
              {%- elif n > 0 -%}
              {#- Translators: first is a problem in lower case, such as a fault in the gateway; the sentence names it, more counts the others -#}
              <div><ha-alert alert-type="warning"><b>{% if n == 1 %}_("Needs a look: {first}."){% else %}_("Needs a look: {first} and {more} more."){% endif %}</b><br>_("The gateway runs and its radio is connected.")</ha-alert></div>
              {%- elif waiting > 0 -%}
              {#- Translators: waiting is a whole number: the messages on their way that the gateway took over a minute ago -#}
              <div><ha-alert alert-type="info"><b>_("Messages waiting over a minute: {waiting}.")</b><br>_("They go out one at a time, as soon as the radio and the airtime allow.")</ha-alert></div>
              {%- else -%}
              {#- Translators: notes is a whole number, 2 or more: the cards in blue below, for information -#}
              <div><ha-alert alert-type="success"><b>_("All fine.")</b><br>_("Radio connected, nothing waiting.") {% if notes == 1 %}_("One note below."){% elif notes > 1 %}_("{notes} notes below."){% endif %}</ha-alert></div>
              {%- endif %}
              <div><a href="./map">_("Map")</a> · <a href="./gateway">_("Gateway")</a> · <a href="./settings">_("Settings")</a> · <a href="./help">_("Help")</a></div>
              {#- Translators: Needs a look is the start of the first line in yellow, and Help the page of that name: say both as translated there #}
              <details><summary>_("What the colours mean")</summary><ul><li>_("Red: act now; nothing gets through, or someone else controls the radio.")</li><li>_("Yellow: something is missing or looks odd; the card below says what to do.")</li><li>_("Blue: for your information, or no value yet.")</li><li>_("Green: all fine.")</li><li>_("The words after Needs a look are explained in Help.")</li></ul></details>
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: taken_over -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro mon(v) -%}
              {#- Translators: an abbreviated month name, as in 22 Oct 10:31 -#}
              {%- if v == 1 -%}_("Jan")
              {%- elif v == 2 -%}_("Feb")
              {%- elif v == 3 -%}_("Mar")
              {%- elif v == 4 -%}_("Apr")
              {%- elif v == 5 -%}_("May")
              {%- elif v == 6 -%}_("Jun")
              {%- elif v == 7 -%}_("Jul")
              {%- elif v == 8 -%}_("Aug")
              {%- elif v == 9 -%}_("Sep")
              {%- elif v == 10 -%}_("Oct")
              {%- elif v == 11 -%}_("Nov")
              {%- elif v == 12 -%}_("Dec")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro when(v) -%}
              {%- set t = v | as_datetime(default=none) -%}
              {%- if t is none -%}–
              {%- else -%}
              {%- set t = t | as_local -%}{%- set days = ((now() | as_local).date() - t.date()).days -%}
              {%- set time = m(t.strftime('%H:%M')) -%}{%- set day = t.day | int -%}{%- set month = mon(t.month) -%}
              {%- if days <= 0 -%}{{ m(t.strftime('%H:%M')) }}
              {%- elif days == 1 -%}
              {#- Translators: the day before today and a clock time such as 23:50 -#}
              _("yesterday {time}")
              {%- else -%}
              {#- Translators: an older day: the day of the month, an abbreviated month name and a clock time, as in 22 Oct 10:31 -#}
              _("{day} {month} {time}")
              {%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'binary_sensor.@gw@_radio_link_contested' -%}
              {%- if is_state(e, 'on') -%}
              {%- set since = when(states[e].last_changed) -%}
              {#- Translators: since is a time, such as 10:31 or yesterday 10:31 -#}
              <div><ha-alert alert-type="error"><b>_("Another program took over the radio's link, since {since}.")</b> _("If it was you (the phone app over Wi-Fi, a command-line tool), close it and stop the gateway first next time. If not, tell your administrator now: the radio needs a network of its own and a new key.")</ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("The gateway reaches its radio over the network, and the radio serves one program at a time. A program that held the link could control the radio and read its key, which decrypts direct messages.")</p><p>_("The gateway took the link back; this card stays for an hour. A takeover the radio did not report can be missed, so the absence of this card is no proof.")</p></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: degraded -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro part(v) -%}
              {%- if v == 'history' -%}_("message history broken")
              {%- elif v == 'state_file' -%}_("state file cannot be written")
              {%- elif v == 'exclusions_unreadable' -%}_("list of people not to ask unreadable")
              {%- elif v == 'exclusions_unsaved' -%}_("list of people not to ask not saved")
              {%- elif v == 'errors' -%}_("program errors in the last hour")
              {%- elif v == 'lag' -%}_("slow responses")
              {%- elif v == 'disk' -%}_("disk almost full")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro parts(v) -%}{%- for p in v -%}{{ part(p) }}{% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {%- set e = 'binary_sensor.@gw@_degraded' -%}
              {%- if is_state(e, 'on') -%}
              {%- set ns = namespace(found=[]) -%}
              {%- if state_attr(e, 'history') == 'broken' -%}{%- set ns.found = ns.found + ['history'] -%}{%- endif -%}
              {%- if state_attr(e, 'state_file') not in [none, 'ok'] -%}{%- set ns.found = ns.found + ['state_file'] -%}{%- endif -%}
              {%- if state_attr(e, 'exclusions') == 'unreadable' -%}{%- set ns.found = ns.found + ['exclusions_unreadable'] -%}{%- elif state_attr(e, 'exclusions') not in [none, 'ok'] -%}{%- set ns.found = ns.found + ['exclusions_unsaved'] -%}{%- endif -%}
              {%- if state_attr(e, 'errors_1h') | int(0) > 0 -%}{%- set ns.found = ns.found + ['errors'] -%}{%- endif -%}
              {%- if state_attr(e, 'loop_lag_max_s') | float(0) >= 1 -%}{%- set ns.found = ns.found + ['lag'] -%}{%- endif -%}
              {%- if state_attr(e, 'disk_free_mb') is number and state_attr(e, 'disk_free_mb') < 100 -%}{%- set ns.found = ns.found + ['disk'] -%}{%- endif -%}
              {%- set found = parts(ns.found) -%}
              {#- Translators: found is a list of the parts at fault, such as program errors in the last hour, disk almost full -#}
              <div><ha-alert alert-type="warning"><b>{% if ns.found %}_("The gateway runs with a fault: {found}."){% else %}_("The gateway runs with a fault."){% endif %}</b> _("Messages still go out. Tell your administrator.")<br><a href="./gateway">_("Gateway: Health")</a></ha-alert></div>
              <details><summary>_("What this means")</summary><ul><li><b>_("message history broken")</b>: _("The chats show no new messages until the gateway is restarted. Your administrator checks the disk.")</li><li><b>_("state file cannot be written")</b>: _("The disk is full or read-only. The gateway forgets new contacts' devices at its next start.")</li><li><b>_("list of people not to ask unreadable")</b>: _("Asking for position and battery is paused until the file is fixed or deleted.")</li><li><b>_("list of people not to ask not saved")</b>: _("It works now, but a restart would forget the latest change.")</li><li><b>_("program errors in the last hour")</b>: _("The gateway caught an error and runs on. Its log has the details.")</li><li><b>_("slow responses")</b>: _("The computer gives the gateway too little time: a backup, or too little memory.")</li><li><b>_("disk almost full")</b>: _("Free some space on the gateway's disk.")</li></ul></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: look_alike -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set devices = [] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list -%}
              {#- a look-alike's first 12 key digits are those of the contact it imitates: that contact's name, else 8 digits of its key -#}
              {%- macro who(k) -%}
              {%- set r = namespace(name=none) -%}
              {%- for d in devices if (device_attr(d, 'serial_number') or '')[:12] == (k | string)[:12] -%}{%- set r.name = device_attr(d, 'name_by_user') or device_attr(d, 'name') -%}{%- endfor -%}
              {{ m(r.name or (k | string)[:8]) }}
              {%- endmacro -%}
              {%- macro listed(v) -%}{%- for k in v[:3] -%}{{ who(k) }}{% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {%- set e = 'binary_sensor.@gw@_look_alike' -%}
              {%- if is_state(e, 'on') -%}
              {%- set nodes = state_attr(e, 'nodes') or [] -%}
              {%- set keys = listed(nodes) -%}{%- set more = (([state_attr(e, 'total') | int(0), nodes | count] | max) - ([nodes | count, 3] | min)) | int -%}
              {#- Translators: keys names the contacts that nodes nearby imitate, or the first digits of their keys -#}
              <div><ha-alert alert-type="warning"><b>{% if more > 0 %}_("A node nearby imitates a contact: {keys} and {more} more."){% else %}_("A node nearby imitates a contact: {keys}."){% endif %}</b> _("Do not trust a message only because its name looks known.")</ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("Contacts are told apart by the first bytes of their key. A node with the same first bytes may be chance or someone imitating that contact. The gateway does not act on commands from it and does not ask it for its position. If it stays, tell your administrator.")</p></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: remote_cli -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set devices = [] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list -%}
              {%- macro who(k) -%}
              {%- set r = namespace(name=none) -%}
              {%- for d in devices if device_attr(d, 'serial_number') == k -%}{%- set r.name = device_attr(d, 'name_by_user') or device_attr(d, 'name') -%}{%- endfor -%}
              {{ m(r.name or (k | string)[:8]) }}
              {%- endmacro -%}
              {%- macro listed(v) -%}{%- for k in v[:3] -%}{{ who(k) }}{% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {%- set e = 'binary_sensor.@gw@_remote_cli' -%}
              {%- if is_state(e, 'on') -%}
              {%- set keys = state_attr(e, 'contacts') or [] -%}
              {%- set names = listed(keys) -%}{%- set more = (([state_attr(e, 'total') | int(0), keys | count] | max) - ([keys | count, 3] | min)) | int -%}
              {#- Translators: names are the names of contacts, or the first digits of their keys -#}
              <div><ha-alert alert-type="warning"><b>{% if more > 0 %}_("{names} and {more} more may control this home's radio over the air."){% else %}_("{names} may control this home's radio over the air."){% endif %}</b> _("If nobody meant to allow it, ask your administrator to take the permission away in the MeshCore app.")</ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("Such a contact can change the radio's settings and read its contacts from afar. Give it only to a radio you control.")</p></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: advert_position -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {#- now(): the card renders again each minute, as the registry it reads tells no listener -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set devices = [] if gw is none else integration_entities('mqtt') | select('is_device_attr', 'via_device_id', gw) | map('device_id') | unique | list -%}
              {%- macro who(k) -%}
              {%- set r = namespace(name=none) -%}
              {%- for d in devices if device_attr(d, 'serial_number') == k -%}{%- set r.name = device_attr(d, 'name_by_user') or device_attr(d, 'name') -%}{%- endfor -%}
              {{ m(r.name or (k | string)[:8]) }}
              {%- endmacro -%}
              {%- macro listed(v) -%}{%- for k in v[:3] -%}{{ who(k) }}{% if not loop.last %}, {% endif %}{%- endfor -%}{%- endmacro -%}
              {%- set e = 'binary_sensor.@gw@_advert_position' -%}
              {%- if is_state(e, 'on') -%}
              {%- set keys = state_attr(e, 'contacts') or [] -%}
              {%- set names = listed(keys) -%}{%- set more = (([state_attr(e, 'total') | int(0), keys | count] | max) - ([keys | count, 3] | min)) | int -%}
              {#- Translators: names are the names of contacts, or the first digits of their keys -#}
              <div><ha-alert alert-type="warning"><b>{% if more > 0 %}_("{names} and {more} more broadcast their position to everyone in range."){% else %}_("{names} broadcast their position to everyone in range."){% endif %}</b> _("On that device, check in the MeshCore app that sharing the location in adverts is off, then send an advert near this home's radio.")</ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("The household's map does not need it: the gateway asks for positions privately (Ask for position and battery).")</p><p>_("The gateway reads each advert. Until it has read a device's newest advert, for example one sent while the gateway was stopped for an update or a restart, it goes by the position this home's radio still remembers for that device: from an older advert, or written by another app. The radio keeps that position after sharing is switched off.")</p><p>_("The card goes once the gateway has read an advert without a position.")</p></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: profile -#}
              {%- set e = 'sensor.@gw@_profile' -%}
              {%- if states(e) in ['problem', 'drift'] -%}
              <div><ha-alert alert-type="warning"><b>{% if states(e) == 'problem' %}_("The radio's settings could not be set."){% else %}_("Someone changed the radio's settings."){% endif %}</b> _("Tell your administrator.")<br><a href="./gateway">_("Gateway: Radio settings")</a></ha-alert></div>
              <details><summary>_("What this means")</summary><p>_("The gateway keeps a few radio settings as this home needs them. If the radio's frequency or speed differ from the others', messages do not reach them.")</p></details>{%- endif -%}
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- problem: telemetry -#}
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set e = 'sensor.@gw@_telemetry_status' -%}
              {%- set reason = state_attr(e, 'reason') -%}
              {%- if states(e) == 'paused' and reason != 'no_radio' -%}
              {%- if reason == 'exclusions_unreadable' -%}
              <div><ha-alert alert-type="warning"><b>_("Asking for position and battery is paused: the list of people not to ask cannot be read.")</b> _("Tell your administrator: the file must be fixed or deleted, then the gateway restarted.")</ha-alert></div>
              {%- elif reason == 'auto_add' -%}
