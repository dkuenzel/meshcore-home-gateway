              {%- endif -%}
              {%- endmacro -%}
              {#- now(): the card renders again each minute, so a new contact shows also when no row has a time yet -#}
              {%- set clock = now() -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for e in integration_entities('mqtt') | select('match', 'sensor\\.@contact@_.+_last_heard(_\\d+)?$') if gw and device_attr(e, 'via_device_id') == gw -%}
              {%- set device = device_id(e) -%}
              {%- set tn = namespace(state='') -%}
              {%- for s in device_entities(device) | select('match', 'sensor\\.@contact@_.+_telemetry_state(_\\d+)?$') -%}{%- set tn.state = states(s) -%}{%- endfor -%}
              {%- set ns.rows = ns.rows + [[states(e) if states(e) not in ['unknown', 'unavailable'] else '', device_attr(device, 'name_by_user') or device_attr(device, 'name') or '?', device_attr(device, 'model') or '', tn.state]] -%}
              {%- endfor -%}
              {%- if not ns.rows -%}
              _("No contact has a device in Home Assistant.")
              {%- else -%}
              <table><tr><th>_("Name")</th><th>_("Type")</th><th>_("Heard")</th><th>_("Telemetry")</th></tr>{%- for r in ns.rows | sort(attribute=0, reverse=true) -%}<tr><td>{{ m(r[1]) }}</td><td>{{ m(r[2]) }}</td><td>{{ ago(r[0]) }}</td><td>{{ telemetry(r[3]) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
# @if controls
          - type: entities
            title: _("Telemetry and removal")
            state_color: true
            entities: ["@controls@"]
# @end
          - type: entities
            title: _("Add a contact")
            entities:
              - entity: select.@gw@_add_node
              - entity: text.@gw@_add_contact
          - type: markdown
            title: _("Last contact event")
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- macro ago(value) -%}
              {%- set t = value | as_datetime(default=none) -%}
              {%- if t is none -%}–{%- else -%}
              {%- set s = (now() - t).total_seconds() | int -%}
              {#- Translators: how long ago; n is a whole number -#}
              {%- if s < 3600 -%}{%- set n = [s // 60, 0] | max -%}_("{n} min ago"){%- elif s < 86400 -%}{%- set n = s // 3600 -%}_("{n} h ago"){%- else -%}{%- set n = s // 86400 -%}_("{n} d ago"){%- endif -%}
              {%- endif -%}
              {%- endmacro -%}
              {%- macro what(v) -%}
              {%- if v == 'added' -%}_("added to the radio")
              {%- elif v == 'removed' -%}_("removed from the radio")
              {%- elif v == 'hidden' -%}_("device deleted in Home Assistant")
              {%- elif v == 'shown' -%}_("device back in Home Assistant")
              {%- elif v == 'refused' -%}_("request refused")
              {%- elif v == 'failed' -%}_("request failed")
              {%- elif v == 'excluded' -%}_("excluded from telemetry")
              {%- elif v == 'included' -%}_("included in telemetry")
              {%- elif v == 'position_in_advert' -%}_("shares its position in adverts")
              {%- else -%}{{ m(v) }}
              {%- endif -%}
              {%- endmacro -%}
              {#- the reasons of mqtt-api.md, Managing contacts and Excluding; one added later, and the radio's refusals, stay codes -#}
              {%- macro why(v) -%}
              {%- if v == 'invalid_request' -%}_("invalid request")
              {%- elif v == 'invalid_link' -%}_("no key, link or contact card")
              {%- elif v == 'unsupported_link' -%}_("a link of another kind")
              {%- elif v == 'unsupported_type' -%}_("unsupported node type")
              {%- elif v == 'unknown_node' -%}_("no heard node or contact of that name")
              {%- elif v == 'unknown_contact' -%}_("not a contact on the radio")
              {%- elif v == 'management_off' -%}_("contact management is off")
              {%- elif v == 'own_key' -%}_("the gateway's own key")
              {%- elif v == 'protected' -%}_("a target or command sender")
              {%- elif v == 'busy' -%}_("too many requests waiting")
              {%- elif v == 'no_radio' -%}_("no radio")
              {%- elif v == 'untested_firmware' -%}_("firmware not tested")
              {%- elif v == 'rate_limited' -%}_("too many requests")
              {%- elif v == 'already_contact' -%}_("already a contact")
              {%- elif v == 'look_alike' -%}_("another contact has the same key prefix")
              {%- elif v == 'table_full' -%}_("contact table full")
              {%- elif v == 'not_confirmed' -%}_("the radio's table does not show it")
              {%- elif v == 'outcome_unknown' -%}_("outcome unknown: the next table read tells")
              {%- elif v == 'not_a_companion' -%}_("never asked for telemetry")
              {%- elif v == 'too_many' -%}_("too many keys stored")
              {%- elif v == 'not_saved' -%}_("in effect, not stored yet")
              {%- elif v == 'not_forgotten' -%}_("in effect, history not deleted")
              {%- elif v == 'state_unwritable' -%}_("cannot be stored")
              {%- elif v == 'too_large' -%}_("request too large")
              {%- elif v == 'invalid_utf8' -%}_("request not UTF-8")
              {%- elif v == 'retained' -%}_("published with the retain flag")
              {%- elif v == 'internal_error' -%}_("internal error: see the log")
              {%- else -%}<code>{{ m(v) }}</code>
              {%- endif -%}
              {%- endmacro -%}
              {%- set e = 'event.@gw@_contact' -%}
              {%- set kind = state_attr(e, 'event_type') -%}
              {%- if kind is none -%}
              _("No contact event yet.")
              {%- else -%}
              {%- set reason = state_attr(e, 'reason') -%}
              <div><b>{{ m(state_attr(e, 'name') or state_attr(e, 'prefix') or '?') }}</b> {{ what(kind) }}{% if reason %} ({{ why(reason) }}){% endif %} {{ ago(states(e)) }}</div>
              {%- endif %}
      - type: grid
        cards:
          - type: heading
            heading: _("Nodes heard")
          - type: tile
            entity: sensor.@gw@_nodes
          - type: markdown
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set options = state_attr('select.@gw@_add_node', 'options') -%}
              {%- if options is none -%}
              _("The gateway's controls are not in Home Assistant yet.")
              {%- elif not options -%}
              _("No companion, room server or sensor heard that is not a contact.")
              {%- else -%}
              <table>{%- for o in options -%}<tr><td>{{ m(o) }}</td></tr>{%- endfor -%}</table>
              {%- endif %}
          - type: markdown
            title: _("Add the gateway in the MeshCore app")
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set link = state_attr('binary_sensor.@gw@_radio', 'contact_link') -%}
              {%- if link -%}
              <ha-qr-code data="{{ m(link) }}" scale="4"></ha-qr-code>
              {%- else -%}
              _("The radio is not known yet.")
              {%- endif %}
  - title: _("Map")
    path: map
    subview: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
# @if trackers
          - type: map
            entities: ["@trackers@"]
            hours_to_show: 24
            theme_mode: auto
            grid_options:
              columns: full
              rows: 8
# @else
          - type: markdown
            content: |-
              > [!NOTE]
              > _("No contact had a position when this dashboard was made. Generate it again once one has.")
# @end
          - type: markdown
            show_empty: false
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set listed = ["@trackers@"] -%}
              {#- a listed tracker counts by its contact's key (the device's serial number): with a contact shared by two gateways, the ID written from the state file can be the other gateway's tracker of the same node -#}
              {%- set keys = listed | map('device_attr', 'serial_number') | reject('none') | list -%}
              {%- set ns = namespace(names=[]) -%}
              {%- for t in integration_entities('mqtt') | select('match', 'device_tracker\\.') if gw and t not in listed and device_attr(t, 'via_device_id') == gw and device_attr(t, 'serial_number') not in keys -%}
              {%- set ns.names = ns.names + [device_attr(t, 'name_by_user') or device_attr(t, 'name') or t] -%}
              {%- endfor -%}
              {%- if ns.names -%}
              {%- set names = m(ns.names | join(', ')) -%}
              {#- Translators: names are the contacts' names, separated by commas -#}
              <div><ha-alert alert-type="info">_("Not on this map: {names}. Generate the dashboard again to add them.")</ha-alert></div>
              {%- endif %}
  - title: _("Gateway")
    path: gateway
    subview: true
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Gateway")
            badges:
              - type: button
                text: _("Settings")
                icon: mdi:cog
                tap_action:
                  action: navigate
                  navigation_path: ./settings
              - type: button
                text: _("Help")
                icon: mdi:help-circle
                tap_action:
                  action: navigate
                  navigation_path: ./help
      - type: grid
        cards:
          - type: heading
            heading: _("Radio health")
          - type: tile
            entity: sensor.@gw@_noise_floor
          - type: tile
            entity: sensor.@gw@_radio_airtime
          - type: tile
            entity: sensor.@gw@_telemetry_status
          - type: tile
            entity: sensor.@gw@_profile
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.@gw@_airtime
              - entity: sensor.@gw@_radio_airtime
  - title: _("Settings")
    path: settings
    subview: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Settings")
  - title: _("Help")
    path: help
    subview: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: _("Help")
          - type: markdown
            text_only: true
            content: |-
              <details><summary>_("When something is wrong")</summary><ul><li>_("The first line of Overview names the problem; the card below it says what to do. Tell your administrator the time and what the card says.")</li><li><b>_("a fault in the gateway")</b>: _("A part of the gateway does not work as it should. Messages still go out.")</li><li><b>_("a node imitates a contact")</b>: _("A radio nearby has a key that starts like a contact's.")</li><li><b>_("remote access to the radio")</b>: _("A contact may change this home's radio over the air.")</li><li><b>_("a position broadcast to everyone")</b>: _("A person's device tells everyone in range where it is.")</li><li><b>_("the radio's settings")</b>: _("The radio's settings could not be set, or someone changed them.")</li><li><b>_("asking for position and battery is paused")</b>: _("The gateway asks nobody for now; the card says why.")</li><li><b>_("the radio's clock")</b>: _("The radio's clock is far off.")</li><li><b>_("the contact table is full")</b>: _("The radio cannot add a new contact.")</li><li><b>_("the dashboard and the gateway are of different versions")</b>: _("Some cards may be missing or empty until your administrator updates one of them.")</li></ul></details>
# @each chats
  - title: "@chats.title@"
    path: "@chats.path@"
    subview: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "@chats.title@"
# @if chats.pair
          - type: markdown
            text_only: true
            content: |-
              {%- macro m(x) -%}{{ (x or '') | string | regex_replace('[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u00ad\u061c\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]', '') | regex_replace('[\t\r\n\u2028\u2029]', ' ') | e }}{%- endmacro -%}
              {%- set a = m('@chats.target@') -%}
              {%- set b = m('@chats.pair@') -%}
              {#- Translators: name is the chat's title, a and b are aliases of targets of the gateway's configuration -#}
              <div><ha-alert alert-type="warning"><b>_("You cannot write to {name} from here.")</b><br>_("For your administrator: the targets {a} and {b} get the same entity IDs in Home Assistant. Rename one of them in the gateway's configuration.")</ha-alert></div>
# @end
# @if chats.write
    footer:
      card:
        type: vertical-stack
        visibility:
          - condition: template
            value_template: >-
              {%- set gw = device_id('binary_sensor.@gw@_radio') -%}
              {%- set t = '@chats.write@' -%}{%- set b = '@chats.send@' -%}{%- set d = device_id(t) -%}
              {{ gw is not none and d is not none and device_id(b) == d
                 and states[t] is not none and not is_state(t, 'unavailable')
                 and states[b] is not none and not is_state(b, 'unavailable')
                 and (d == gw if '@chats.target@' != '' else
                      device_attr(d, 'via_device_id') == gw and
                      device_attr(d, 'serial_number') == '@chats.key@') }}
        cards:
          - type: markdown
            text_only: true
            show_empty: false
            content: |-
              {#- the refused line: shown when a Send of this chat was refused -#}
          - type: entities
            entities:
              - entity: "@chats.write@"
                # Translators: the label of a chat's message field; name is the chat's title, a
                # channel or a person
                name: _("Write to {name}")
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
          - type: tile
            entity: "@chats.send@"
            # Translators: the name beside a chat's send button: the keyboard's key in the words
            # the phones of your language show, then the button's label exactly as translated
            name: _("Return, then Send")
            icon: mdi:send
            hide_state: true
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features_position: inline
            features:
              - type: button
                # Translators: the label on a chat's send button; keep it one short word
                action_name: _("Send")
# @end
# @end
